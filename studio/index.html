<head>

  <link rel="icon" type="image/svg+xml" href="../assets/site-icons/favicon.svg?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/site-icons/apple-touch-icon.png?v=1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <meta name="theme-color" content="#070b08">

  <link rel="preload" href="../assets/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="../css/signal-studio.css?v=20260930n1">
</head>
<body class="studio-landing">
  <main class="landing-shell">
    <header class="landing-header">
      <nav class="landing-nav" aria-label="Studio navigation">
        <a class="nav-tab" href="what-i-do.html"><span class="tab-prompt" aria-hidden="true">./</span>what I do</a>
        <a class="nav-tab" href="selected-work.html"><span class="tab-prompt" aria-hidden="true">./</span>selected work</a>
        <button class="nav-cta" type="button" data-panel="inquire" aria-controls="inquire" aria-expanded="false">Inquire</button>
        <a class="brain-map-link" href="../brainmap/" aria-label="Explore Gus Halwani's brain map">
          <svg class="network-mark" viewBox="0 0 44 28" aria-hidden="true">
            <path d="M9 7 21 14 34 6M21 14l9 9M21 14 8 8" />
            <circle cx="9" cy="7" r="2.5" />
            <circle cx="34" cy="6" r="2.5" />
            <circle class="network-core" cx="21" cy="14" r="3.5" />
            <circle cx="13" cy="22" r="2.5" />
            <circle cx="30" cy="23" r="2.5" />
          </svg>
          <span>Explore my brain map</span>
        </a>
      </nav>

      <section class="landing-inquire" id="inquire" aria-labelledby="inquire-label" hidden>
        <h1 id="inquire-label" class="sr-only">Inquire</h1>
        <a class="landing-email" href="#inquire" data-mail="Project inquiry" rel="nofollow">gushalwani [at] alum [dot] mit [dot] edu</a>
        <p>I take on select speaking engagements, workshops, and project work.</p>
        <a class="cta-button" href="#inquire" data-mail="Project inquiry" rel="nofollow">Write to me <span class="cta-arrow" aria-hidden="true">→</span></a>
      </section>
    </header>

    <div class="landing-wordmark" aria-label="Halwani">
      <span>Halwani</span><i aria-hidden="true"></i>
    </div>
  </main>

  <script>
    const inquireButton = document.querySelector('[data-panel="inquire"]');
    const inquirePanel = document.getElementById('inquire');
    const setInquireOpen = (opening) => {
      inquirePanel.hidden = !opening;
      inquireButton.classList.toggle('is-active', opening);
      inquireButton.setAttribute('aria-expanded', String(opening));
    };

    inquireButton.addEventListener('click', () => {
      setInquireOpen(inquirePanel.hidden);
    });

    if (window.location.hash === '#inquire') setInquireOpen(true);

  </script>
  <script src="../js/studio.js?v=20260927r2" defer></script>
</body>
</html>
