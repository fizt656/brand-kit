<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/site-icons/favicon-32.png?v=1">
  <link rel="icon" type="image/svg+xml" href="assets/site-icons/favicon.svg?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/site-icons/apple-touch-icon.png?v=1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HALWANI — an independent studio by Gus Halwani.">
  <meta name="theme-color" content="#070b08">
  <link rel="canonical" href="https://gushalwani.com/">
  <title>HALWANI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signal-studio.css?v=20260923c">
</head>
<body class="studio-landing">
  <main class="landing-shell">
    <header class="landing-header">
      <nav class="landing-nav" aria-label="Studio navigation">
        <a class="nav-tab" href="studio/what-i-do.html"><span class="tab-prompt" aria-hidden="true">./</span>what I do</a>
        <a class="nav-tab" href="studio/selected-work.html"><span class="tab-prompt" aria-hidden="true">./</span>selected work</a>
        <button class="nav-tab" type="button" data-panel="inquire" aria-controls="inquire" aria-expanded="false"><span class="tab-prompt" aria-hidden="true">./</span>inquire</button>
        <a class="brain-map-link" href="brainmap/" aria-label="Explore Gus Halwani's brain map">
          <svg class="network-mark" viewBox="0 0 44 28" aria-hidden="true">
            <path d="M9 7 21 14 34 6M21 14l9 9M21 14 8 8" />
            <circle cx="9" cy="7" r="2.5" />
            <circle cx="34" cy="6" r="2.5" />
            <circle class="network-core" cx="21" cy="14" r="3.5" />
            <circle cx="13" cy="22" r="2.5" />
            <circle cx="30" cy="23" r="2.5" />
          </svg>
          <span>Explore my brain map</span>
        </a>
      </nav>

      <section class="landing-inquire" id="inquire" aria-labelledby="inquire-label" hidden>
        <h1 id="inquire-label" class="sr-only">Inquire</h1>
        <a class="landing-email" id="email-link" href="#" rel="nofollow">gushalwani [at] alum [dot] mit [dot] edu</a>
        <p>I take on select speaking engagements, workshops, and project work.</p>
      </section>
    </header>

    <div class="landing-wordmark" aria-label="Halwani">
      <span>Halwani</span><i aria-hidden="true"></i>
    </div>
  </main>

  <script>
    const inquireButton = document.querySelector('[data-panel="inquire"]');
    const inquirePanel = document.getElementById('inquire');
    const setInquireOpen = (opening) => {
      inquirePanel.hidden = !opening;
      inquireButton.classList.toggle('is-active', opening);
      inquireButton.setAttribute('aria-expanded', String(opening));
    };

    inquireButton.addEventListener('click', () => {
      setInquireOpen(inquirePanel.hidden);
    });

    if (window.location.hash === '#inquire') setInquireOpen(true);

    const emailLink = document.getElementById('email-link');
    emailLink.addEventListener('click', (event) => {
      event.preventDefault();
      const user = ['gus', 'halwani'].join('');
      const host = ['alum', 'mit', 'edu'].join('.');
      window.location.href = 'mailto:' + user + '@' + host + '?subject=' + encodeURIComponent('Project inquiry');
    });
  </script>
</body>
</html>
