      // Interface sound is optional; browser policy must never block play.
    }
  }

  root.addEventListener('pointerdown', function (ev) {
    var target = ev.target && ev.target.closest ? ev.target.closest('button') : null;
    if (target && !target.disabled) playUiTone('click');
  });

  // ── Screens: title → intro → game ─────────────────────────────────────────

  // Fit each artwork to its own proportions. Ignore late loads from a previous room.
  function sizeArtwork(frame, imageUrl) {
    frame._artworkUrl = imageUrl;
    frame.style.setProperty('--sf-image-ratio', (Number(ratio[0]) || 16) / (Number(ratio[1]) || 9));
    if (!imageUrl) return;
    var image = new Image();
    image.onload = function () {
      if (frame._artworkUrl === imageUrl && image.naturalWidth && image.naturalHeight) {
        frame.style.setProperty('--sf-image-ratio', image.naturalWidth / image.naturalHeight);
      }
    };
    image.src = imageUrl;
  }

  function buildScreen(className, imageUrl) {
    var screen = el('div', 'sf-screen ' + className);
    var frame = el('div', 'sf-screen-frame');
    if (imageUrl) frame.style.backgroundImage = 'url("' + imageUrl + '")';
    sizeArtwork(frame, imageUrl);
    screen.appendChild(frame);
    return { screen: screen, frame: frame };
  }

  function showTitle() {
    document.documentElement.classList.add('sf-title-active');
    root.innerHTML = '';
    var built = buildScreen('sf-title', G.title.image);
    var panel = el('div', 'sf-title-panel');
    if (!G.title.image) {
      panel.appendChild(el('h1', 'sf-title-heading', G.title.heading || G.meta.name));
      if (G.title.subheading) panel.appendChild(el('p', 'sf-title-sub', G.title.subheading));
    }
    if (music || synthMusic) {
      titleAudioBtn = el('button', 'sf-title-audio');
      titleAudioBtn.title = 'Enable or mute the title-screen score';
      titleAudioBtn.onclick = function () {
        if (state.muted) setMuted(false);
        else if (!audioUnlocked) unlockMusic();
        else setMuted(true);
      };
      panel.appendChild(titleAudioBtn);
      updateAudioButtons();
    }
    var buttons = el('div', 'sf-title-buttons');
    if (hasSave()) {
      var cont = el('button', 'sf-btn sf-btn-pixel', 'Continue');
      cont.onclick = function () { loadGame(); enterGame(true); };
      buttons.appendChild(cont);
      var fresh = el('button', 'sf-btn sf-btn-pixel', 'New Game');
      fresh.onclick = function () { clearSave(); afterTitle(); };
      buttons.appendChild(fresh);
    } else {
      var start = el('button', 'sf-btn sf-btn-pixel', 'Start Game');
      start.onclick = function () { afterTitle(); };
      buttons.appendChild(start);
    }
    panel.appendChild(buttons);
    built.screen.appendChild(panel);
    root.appendChild(built.screen);
    startUploadedMusic();
    armAudioUnlock();
  }

  function afterTitle() {
    document.documentElement.classList.remove('sf-title-active');
    if (G.intro.enabled && (G.intro.image || G.intro.text)) showIntro();
    else enterGame(false);
  }

  function showIntro() {
    document.documentElement.classList.add('sf-intro-active');
    root.innerHTML = '';
    var built = buildScreen('sf-intro', G.intro.image);
    var panel = el('div', 'sf-intro-panel');
    if (G.intro.text) {
      var p = el('p', 'sf-intro-text');
      p.textContent = G.intro.text;
      panel.appendChild(p);
    }
    var btn = el('button', 'sf-btn sf-btn-pixel', 'Begin');
    btn.onclick = function () { enterGame(false); };
    panel.appendChild(btn);
    built.screen.appendChild(panel);
    root.appendChild(built.screen);
  }

  // ── Game UI ───────────────────────────────────────────────────────────────

  var sceneEl, narrationEl, narrationText, inventoryEl, commandWrap, commandInput, historyEl;
  var dialogLog = [];
  var typeTimer = null;
  var selectedItemId = null;
  var busy = false;

  function enterGame(fromSave) {
    document.documentElement.classList.remove('sf-title-active', 'sf-intro-active');
    root.innerHTML = '';
    var frame = el('div', 'sf-frame');

    // Top bar
    var bar = el('div', 'sf-topbar');
    bar.appendChild(el('span', 'sf-topbar-title', G.meta.name));
    var barRight = el('div', 'sf-topbar-right');
    if (music || synthMusic || G.meta.uiSound) {
      muteBtn = el('button', 'sf-iconbtn', state.muted ? '🔇' : '🔊');
      muteBtn.title = 'Toggle audio';
      muteBtn.onclick = function () { setMuted(!state.muted); };
      barRight.appendChild(muteBtn);
    }
    var logBtn = el('button', 'sf-iconbtn', '📜');
    logBtn.title = 'Story log';
    logBtn.onclick = toggleHistory;
    barRight.appendChild(logBtn);
    var cmdBtn = el('button', 'sf-iconbtn', '⌨');
    cmdBtn.title = 'Command bar ( / )';
    cmdBtn.onclick = toggleCommand;
    barRight.appendChild(cmdBtn);
    bar.appendChild(barRight);
    frame.appendChild(bar);

    // Scene
    var sceneSpace = el('div', 'sf-scene-space');
    sceneEl = el('div', 'sf-scene');
    sceneSpace.appendChild(sceneEl);
    frame.appendChild(sceneSpace);

    // Narration
    narrationEl = el('div', 'sf-narration sf-hidden');
    narrationText = el('p', 'sf-narration-text');
    narrationText.tabIndex = 0;
    narrationText.setAttribute('role', 'region');
    narrationText.setAttribute('aria-label', 'Narration (scroll to read more)');
    narrationEl.appendChild(narrationText);
    var dismiss = el('button', 'sf-narration-dismiss', '✕');
    dismiss.title = 'Dismiss (Esc)';
    dismiss.onclick = hideNarration;
    narrationEl.appendChild(dismiss);
    frame.appendChild(narrationEl);

    // History overlay
    historyEl = el('div', 'sf-history sf-hidden');
    frame.appendChild(historyEl);

    // Command bar
    commandWrap = el('div', 'sf-command sf-hidden');
    commandInput = el('input', 'sf-command-input');
    commandInput.placeholder = 'Try: "look at the desk", "use key on door", "go north"…';
    commandInput.onkeydown = function (ev) {
      if (ev.key === 'Enter' && commandInput.value.trim()) {
        var text = commandInput.value.trim();
        commandInput.value = '';
        toggleCommand();
        runCommand(text);
      } else if (ev.key === 'Escape') {
        toggleCommand();
      }
      ev.stopPropagation();
    };
    commandWrap.appendChild(commandInput);
    frame.appendChild(commandWrap);

    // Inventory
    inventoryEl = el('div', 'sf-inventory');
    frame.appendChild(inventoryEl);

    root.appendChild(frame);

    document.addEventListener('keydown', onGlobalKey);

    renderInventory();
    renderRoom(fromSave);
  }

  function onGlobalKey(ev) {
    var target = ev.target;
    if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) return;
    if (ev.key === 'Escape') {
      hideNarration();
      closeWheel();
      if (selectedItemId) selectItem(null);
    } else if (ev.key === '/') {
      ev.preventDefault();
      toggleCommand(true);
    }
  }

  // ── Rooms & hotspots ──────────────────────────────────────────────────────

  function currentRoom() { return roomsById[state.roomId]; }

  function renderRoom(skipEntry) {
    var room = currentRoom();
    closeWheel();
    sceneEl.innerHTML = '';
    sceneEl.classList.remove('sf-scene-enter');
    sceneEl.classList.remove('sf-scene-sync');
    // Force reflow so the fade-in animation restarts on every room change.
    void sceneEl.offsetWidth;
    sceneEl.classList.add('sf-scene-enter');
    if (atmosphere !== 'clean') sceneEl.classList.add('sf-scene-sync');
    playUiTone('shift');

    var takenIds = (room.imageChangingHotspotIds || []).filter(function (id) { return state.taken[id]; }).sort();
    var variant = (room.pickupImages || []).find(function (v) { return JSON.stringify(v.takenHotspotIds.slice().sort()) === JSON.stringify(takenIds); });
    var flagImage = activeFlagImage(room);
    var roomImage = flagImage ? flagImage.image : variant && variant.image ? variant.image : room.image;
    sizeArtwork(sceneEl, roomImage);
    var img = el('div', 'sf-scene-image');
    if (roomImage) {
      img.style.backgroundImage = 'url("' + roomImage + '")';
    } else {
      img.classList.add('sf-scene-missing');
      img.appendChild(el('p', 'sf-scene-missing-text', room.name + ' — no scene image yet'));
    }
    sceneEl.appendChild(img);

    var label = el('div', 'sf-room-label', room.name);
    sceneEl.appendChild(label);

    room.hotspots.forEach(function (h) {
      if (!isVisible(h)) return;
      var hot = el('button', 'sf-hotspot sf-hotspot-' + h.kind);
      hot.type = 'button';
      hot.setAttribute('aria-label', h.name);
      hot.style.left = h.rect.x + '%';
      hot.style.top = h.rect.y + '%';
      hot.style.width = h.rect.w + '%';
      hot.style.height = h.rect.h + '%';
      var tag = el('span', 'sf-hotspot-tag', h.name);
      hot.appendChild(tag);
      hot.onclick = function (ev) {
        ev.stopPropagation();
        onHotspotClick(h, ev);
      };
      sceneEl.appendChild(hot);
    });

    sceneEl.onclick = function () {
      closeWheel();
      if (selectedItemId) selectItem(null);
    };

    if (!state.visited[room.id]) {
      state.visited[room.id] = true;
      saveGame();
      if (!skipEntry) {
        resolveEntryText(room).then(function (text) {
          if (text && state.roomId === room.id) showNarration('Narrator', text);
        });
      }
    }
  }

  // ── Story flags ───────────────────────────────────────────────────────────

  function isVisible(h) {
    if (h.kind === 'item' && state.taken[h.id]) return false;
    if (h.requiresFlag && !state.flags[h.requiresFlag]) return false;
    if (h.hiddenByFlag && state.flags[h.hiddenByFlag]) return false;
    return true;
  }

  /** The first story-flag image whose flags hold; it replaces the room image. */
  function activeFlagImage(room) {
    var list = room.flagImages || [];
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      if (!v.image) continue;
      if (v.requiresFlag && !state.flags[v.requiresFlag]) continue;
      if (v.hiddenByFlag && state.flags[v.hiddenByFlag]) continue;
      return v;
    }
    return null;
  }

  function visibleSignature() {
    var room = currentRoom();
    var flagImage = activeFlagImage(room);
    return room.hotspots.filter(isVisible).map(function (h) { return h.id; }).join('|') + '#' + (flagImage ? flagImage.image : '');
  }

  /** Apply a list of flag changes; redraw the room if its hotspots changed. */
  function changeFlags(sets, clears, redraw) {
    if (!(sets && sets.length) && !(clears && clears.length)) return;
    var before = visibleSignature();
    (sets || []).forEach(function (f) { state.flags[f] = true; });
    (clears || []).forEach(function (f) { delete state.flags[f]; });
    saveGame();
    if (redraw && visibleSignature() !== before) renderRoom(true);
  }

  function applyHotspotFlags(hotspot, redraw) {
    changeFlags(hotspot.setsFlags, hotspot.clearsFlags, redraw);
  }

  function goToRoom(roomId) {
    if (!roomsById[roomId]) {
      showNarration('Narrator', "That path doesn't lead anywhere yet.");
      return;
    }
    state.roomId = roomId;
    saveGame();
    renderRoom(false);
  }

  // ── Interactions ──────────────────────────────────────────────────────────

  function onHotspotClick(hotspot, ev) {
    hideNarration();
    if (selectedItemId) {
      var itemId = selectedItemId;
      selectItem(null);
      useItemOn(hotspot, itemId);
      return;
    }
    openWheel(hotspot, ev);
  }

  function performVerb(hotspot, verb) {
    if (busy) return;
    closeWheel();

    if (verb === 'use' && hotspot.kind === 'exit') return tryExit(hotspot);
    if (verb === 'use' && hotspot.kind === 'item') return tryPickup(hotspot);
    if (verb === 'use' && hotspot.requiredItemId && !state.unlocked[hotspot.id]) {
      var itemName = itemsById[hotspot.requiredItemId] ? itemsById[hotspot.requiredItemId].name : 'something';
      showNarration('Narrator', hotspot.lockedText || 'It won’t budge. You probably need ' + article(itemName) + '.');
      return;
    }

    setBusy(true);
    resolveVerbText(hotspot, verb).then(function (text) {
      setBusy(false);
      showNarration(verb === 'talk' && hotspot.kind === 'npc' ? hotspot.name : 'Narrator', text);
      if (verb === 'use' && !hotspot.requiredItemId) applyHotspotFlags(hotspot, true);
      if (verb === 'use' && (hotspot.cutsceneId || hotspot.cutsceneVariants) && !hotspot.requiredItemId) playHotspotCutsceneAfter(hotspot, text);
    });
  }

  function tryExit(hotspot) {
    if (hotspot.requiredItemId && !state.unlocked[hotspot.id]) {
      if (state.inventory.indexOf(hotspot.requiredItemId) !== -1) {
        // Holding the key: unlock implicitly.
        state.unlocked[hotspot.id] = true;
        saveGame();
        var item = itemsById[hotspot.requiredItemId];
        consumeRequiredItem(hotspot);
        applyHotspotFlags(hotspot, false);
        showNarration('Narrator', 'You use ' + (item ? 'the ' + item.name.toLowerCase() : 'it') + '. The way is open.');
        setTimeout(function () { travel(hotspot); }, 900);
        return;
      }
      var needed = itemsById[hotspot.requiredItemId];
      showNarration('Narrator', hotspot.lockedText || ('Locked. You need ' + article(needed ? needed.name : 'something') + '.'));
      return;
    }
    applyHotspotFlags(hotspot, false);
    travel(hotspot);
  }

  /** The hotspot's cut scene: the first variant whose conditions hold, else the default. */
  function cutsceneFor(hotspot) {
    var variants = hotspot.cutsceneVariants || [];
    for (var i = 0; i < variants.length; i++) {
      var v = variants[i];
      if (v.requiresItemId && state.inventory.indexOf(v.requiresItemId) === -1) continue;
      if (v.requiresFlag && !state.flags[v.requiresFlag]) continue;
      if (cutscenesById[v.cutsceneId]) return cutscenesById[v.cutsceneId];
    }
    return cutscenesById[hotspot.cutsceneId];
  }

  /** Follow an exit, playing its cut scene on the way when it has one. */
  function travel(hotspot) {
    var cutscene = cutsceneFor(hotspot);
    if (!cutscene || !roomsById[hotspot.targetRoomId]) {
      goToRoom(hotspot.targetRoomId);
      return;
    }
    // Save at the destination first, so a reload mid-scene resumes there.
    state.roomId = hotspot.targetRoomId;
    saveGame();
    hideNarration();
    playCutscene(cutscene, function () { renderRoom(false); });
  }

  /** Trades: a character or object hands over its item once its lock opens. */
  function grantTradeItem(hotspot) {
    if (hotspot.kind === 'item' || !hotspot.grantsItemId || !itemsById[hotspot.grantsItemId]) return null;
    if (state.inventory.indexOf(hotspot.grantsItemId) === -1) state.inventory.push(hotspot.grantsItemId);
    return itemsById[hotspot.grantsItemId];
  }

  function consumeRequiredItem(hotspot) {
    if (!hotspot.consumesRequiredItem || !hotspot.requiredItemId) return;
    state.inventory = state.inventory.filter(function (id) { return id !== hotspot.requiredItemId; });
    if (selectedItemId === hotspot.requiredItemId) selectItem(null);
    renderInventory();
  }

  /** Non-exit hotspots play their cut scene after the player has read the result. */
  function playHotspotCutsceneAfter(hotspot, text) {
    var cutscene = cutsceneFor(hotspot);
    if (!cutscene) return;
    var roomId = state.roomId;
    busy = true;
    setTimeout(function () {
      busy = false;
      if (state.roomId !== roomId) return;
      hideNarration();
      playCutscene(cutscene, function () { renderRoom(true); });
    }, Math.min(5200, 1400 + (text || '').length * 22));
  }

  function tryPickup(hotspot) {
    var itemId = hotspot.grantsItemId;
    if (!itemId || !itemsById[itemId]) {
      performVerbFallbackPickup(hotspot);
      return;
    }
    if (state.inventory.indexOf(itemId) === -1) state.inventory.push(itemId);
    state.taken[hotspot.id] = true;
    applyHotspotFlags(hotspot, false);
    saveGame();
    renderInventory();
    renderRoom(true);
    showNarration('Narrator', 'You take the ' + itemsById[itemId].name.toLowerCase() + '.');
  }

  function performVerbFallbackPickup(hotspot) {
    setBusy(true);
    resolveVerbText(hotspot, 'use').then(function (text) {
      setBusy(false);
      showNarration('Narrator', text);
    });
  }

  function useItemOn(hotspot, itemId) {
    var item = itemsById[itemId];
    if (!item) return;
    var unlocks = hotspot.requiredItemId === itemId && !state.unlocked[hotspot.id];
    setBusy(true);
    resolveComboText(hotspot, itemId, unlocks).then(function (text) {
      setBusy(false);
      var received = null;
      if (unlocks) {
        state.unlocked[hotspot.id] = true;
        received = hotspot.kind === 'exit' ? null : grantTradeItem(hotspot);
        consumeRequiredItem(hotspot);
        saveGame();
        renderInventory();
        if (hotspot.kind !== 'exit') applyHotspotFlags(hotspot, true);
        else applyHotspotFlags(hotspot, false);
      }
      if (received) text += '\n\n(Received: ' + received.icon + ' ' + received.name + ')';
      showNarration('Narrator', text);
      if (unlocks && hotspot.kind === 'exit' && hotspot.targetRoomId) {
        setTimeout(function () { travel(hotspot); }, 1200);
      } else if (unlocks) {
        playHotspotCutsceneAfter(hotspot, text);
      }
    });
  }

  function article(name) {
    return (/^[aeiou]/i.test(name) ? 'an ' : 'a ') + name.toLowerCase();
  }

  // ── Verb wheel ────────────────────────────────────────────────────────────

  var wheelEl = null;

  var WHEEL_VERBS = [
    { verb: 'look', icon: '👁', label: 'Look' },
    { verb: 'use', icon: '✋', label: 'Use' },
    { verb: 'talk', icon: '💬', label: 'Talk' },
    { verb: 'kick', icon: '🦵', label: 'Kick' },
  ];

  function openWheel(hotspot, ev) {
    closeWheel();
    var rect = sceneEl.getBoundingClientRect();
    var cx = ev.clientX - rect.left;
    var cy = ev.clientY - rect.top;
    // Keep the wheel inside the scene.
    cx = Math.max(70, Math.min(rect.width - 70, cx));
    cy = Math.max(70, Math.min(rect.height - 70, cy));

    wheelEl = el('div', 'sf-wheel');
    wheelEl.style.left = cx + 'px';
    wheelEl.style.top = cy + 'px';
    wheelEl.appendChild(el('div', 'sf-wheel-name', hotspot.name));

    var verbs = WHEEL_VERBS;
    if (hotspot.kind === 'exit') {
      verbs = [
        { verb: 'look', icon: '👁', label: 'Look' },
        { verb: 'use', icon: '🚪', label: 'Go' },
      ];
    } else if (hotspot.kind === 'item') {
      verbs = [
        { verb: 'look', icon: '👁', label: 'Look' },
        { verb: 'use', icon: '✋', label: 'Take' },
        { verb: 'kick', icon: '🦵', label: 'Kick' },
      ];
    }

    verbs.forEach(function (v, i) {
      var angle = -Math.PI / 2 + (i * 2 * Math.PI) / verbs.length;
      var btn = el('button', 'sf-wheel-btn');
      btn.innerHTML = '<span class="sf-wheel-icon">' + v.icon + '</span><span class="sf-wheel-label">' + v.label + '</span>';
      btn.style.transform =
        'translate(calc(-50% + ' + Math.round(Math.cos(angle) * 56) + 'px), calc(-50% + ' + Math.round(Math.sin(angle) * 56) + 'px))';
      btn.onclick = function (e) {
        e.stopPropagation();
        performVerb(hotspot, v.verb);
      };
      wheelEl.appendChild(btn);
    });

    sceneEl.appendChild(wheelEl);
  }

  function closeWheel() {
    if (wheelEl && wheelEl.parentNode) wheelEl.parentNode.removeChild(wheelEl);
    wheelEl = null;
  }

  // ── Inventory ─────────────────────────────────────────────────────────────

  function renderInventory() {
    inventoryEl.innerHTML = '';
    var label = el('span', 'sf-inventory-label', 'Inventory');
    inventoryEl.appendChild(label);
    if (state.inventory.length === 0) {
      inventoryEl.appendChild(el('span', 'sf-inventory-empty', 'empty'));
      return;
    }
    state.inventory.forEach(function (itemId) {
      var item = itemsById[itemId];
      if (!item) return;
      var slot = el('button', 'sf-item' + (selectedItemId === itemId ? ' sf-item-selected' : ''));
      slot.appendChild(el('span', 'sf-item-icon', item.icon));
      slot.appendChild(el('span', 'sf-item-name', item.name));
      slot.title = item.description;
      slot.onclick = function (ev) {
        ev.stopPropagation();
        if (item.phone) { selectItem(null); openDialer(item); return; }
        selectItem(selectedItemId === itemId ? null : itemId);
      };
      if (item.phone) slot.title = (item.description ? item.description + ' — ' : '') + 'Click to dial';
      inventoryEl.appendChild(slot);
    });
    if (selectedItemId) {
      var hint = el('span', 'sf-inventory-hint', 'Click something to use it on — Esc to cancel');
      inventoryEl.appendChild(hint);
    }
  }

  function selectItem(itemId) {
    selectedItemId = itemId;
    document.body.classList.toggle('sf-using-item', !!itemId);
    renderInventory();
  }

  // ── Narration, history, busy state ───────────────────────────────────────

  function showNarration(speaker, text) {
    if (!text) return;
    dialogLog.push({ speaker: speaker, text: text });
    if (dialogLog.length > 100) dialogLog.shift();
    narrationEl.classList.remove('sf-hidden');
    narrationText.innerHTML = '';
    narrationText.scrollTop = 0;
    if (speaker && speaker !== 'Narrator') {
      var who = el('span', 'sf-narration-speaker', speaker);
      narrationText.appendChild(who);
    }
    var body = el('span');
    narrationText.appendChild(body);
    // Typewriter, skippable by clicking the narration bar.
    if (typeTimer) clearInterval(typeTimer);
    var i = 0;
    typeTimer = setInterval(function () {
      i += 2;
      body.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typeTimer); typeTimer = null; }
    }, 16);
    narrationEl.onclick = function () {
      if (typeTimer) {
        clearInterval(typeTimer);
        typeTimer = null;
        body.textContent = text;
      }
    };
  }

  function hideNarration() {
    narrationEl.classList.add('sf-hidden');
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  }

  function toggleHistory() {
    if (historyEl.classList.contains('sf-hidden')) {
      historyEl.innerHTML = '';
      var head = el('div', 'sf-history-head');
      head.appendChild(el('span', null, 'Story log'));
      var close = el('button', 'sf-iconbtn', '✕');
      close.onclick = toggleHistory;
      head.appendChild(close);
      historyEl.appendChild(head);
      var list = el('div', 'sf-history-list');
      if (dialogLog.length === 0) list.appendChild(el('p', 'sf-history-empty', 'Nothing yet.'));
      dialogLog.forEach(function (entry) {
        var line = el('p', 'sf-history-line');
        line.innerHTML = '<strong>' + escapeHtml(entry.speaker) + ':</strong> ' + escapeHtml(entry.text);
        list.appendChild(line);
      });
      historyEl.appendChild(list);
      historyEl.classList.remove('sf-hidden');
      list.scrollTop = list.scrollHeight;
    } else {
      historyEl.classList.add('sf-hidden');
    }
  }

  function toggleCommand(forceOpen) {
    var isHidden = commandWrap.classList.contains('sf-hidden');
    if (forceOpen && !isHidden) { commandInput.focus(); return; }
    commandWrap.classList.toggle('sf-hidden');
    if (isHidden) commandInput.focus();
  }

  function setBusy(b) {
    busy = b;
    document.body.classList.toggle('sf-busy', b);
    if (b) showWorkingIndicator();
  }

  // Activity feedback belongs on screen, not in the permanent story log.
  function showWorkingIndicator() {
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
    narrationEl.classList.remove('sf-hidden');
    narrationText.textContent = '…';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ── Phone dial pad ────────────────────────────────────────────────────────

  var dialerEl = null;

  function digitsOf(number) { return String(number || '').replace(/[^0-9*#]/g, ''); }

  function closeDialer() {
    if (dialerEl) dialerEl.remove();
    dialerEl = null;
    window.removeEventListener('keydown', onDialerKey, true);
  }

  var dialerInput = null;
  function onDialerKey(ev) {
    if (!dialerEl) return;
    if (/^[0-9*#]$/.test(ev.key)) dialerInput.press(ev.key);
    else if (ev.key === 'Backspace') dialerInput.back();
    else if (ev.key === 'Enter') dialerInput.call();
    else if (ev.key === 'Escape') closeDialer();
    else return;
    ev.preventDefault();
    ev.stopPropagation();
  }

  /** Keypad overlay for phone items; matching is on digits only. */
  function openDialer(item) {
    closeDialer();
    closeWheel();
    hideNarration();
    var typed = '';
    dialerEl = el('div', 'sf-dialer');
    dialerEl.setAttribute('role', 'dialog');
    dialerEl.setAttribute('aria-label', 'Dial ' + item.name);
    var box = el('div', 'sf-dialer-box');
    box.appendChild(el('div', 'sf-dialer-title', item.icon + ' ' + item.name));
    var display = el('div', 'sf-dialer-display', '');
    display.setAttribute('aria-live', 'polite');
    box.appendChild(display);
    var pad = el('div', 'sf-dialer-pad');
    function render() { display.textContent = typed || 'Enter a number'; display.classList.toggle('sf-dialer-empty', !typed); }
    dialerInput = {
      press: function (d) { if (typed.length < 20) { typed += d; playUiTone('click'); render(); } },
      back: function () { typed = typed.slice(0, -1); render(); },
      call: function () {
        var digits = digitsOf(typed);
        if (!digits) return;
        closeDialer();
        placeCall(item, digits);
      },
    };
    '123456789*0#'.split('').forEach(function (d) {
      var key = el('button', 'sf-dialer-key', d);
      key.type = 'button';
      key.onclick = function (ev) { ev.stopPropagation(); dialerInput.press(d); };
      pad.appendChild(key);
    });
    box.appendChild(pad);
    var actions = el('div', 'sf-dialer-actions');
    var back = el('button', 'sf-btn sf-btn-pixel', '⌫');
    back.title = 'Delete (Backspace)';
    back.onclick = function (ev) { ev.stopPropagation(); dialerInput.back(); };
    var call = el('button', 'sf-btn sf-btn-pixel sf-dialer-call', 'Call');
    call.onclick = function (ev) { ev.stopPropagation(); dialerInput.call(); };
    var hang = el('button', 'sf-btn sf-btn-pixel', 'Hang up');
    hang.title = 'Close (Esc)';
    hang.onclick = function (ev) { ev.stopPropagation(); closeDialer(); };
    actions.appendChild(back);
    actions.appendChild(call);
    actions.appendChild(hang);
    box.appendChild(actions);
    dialerEl.appendChild(box);
    dialerEl.onclick = function (ev) { if (ev.target === dialerEl) closeDialer(); };
    render();
    sceneEl.appendChild(dialerEl);
    window.addEventListener('keydown', onDialerKey, true);
  }

  function placeCall(item, digits) {
    var phone = item.phone || {};
    var contact = (phone.contacts || []).filter(function (c) { return digitsOf(c.number) === digits; })[0];
    if (!contact) {
      showNarration('Narrator', phone.wrongNumberText || 'It rings and rings. Nobody you know.');
      return;
    }
    if (contact.requiresFlag && !state.flags[contact.requiresFlag]) {
      showNarration(contact.speaker || 'Narrator', contact.notReadyText || 'No answer.');
      return;
    }
    showNarration(contact.speaker || 'Narrator', contact.text);
    changeFlags(contact.setsFlags, null, true);
  }

  // ── Cut scenes & ending ───────────────────────────────────────────────────

  var cutsceneLayer = null;

  /** Play frames full-window; click/Enter/Space advances, Esc skips. */
  function playCutscene(cutscene, onDone) {
    closeWheel();
    if (selectedItemId) selectItem(null);
    var frames = (cutscene.frames || []).filter(function (f) { return f.image || f.text; });
    if (frames.length === 0) return finishCutscene(cutscene, onDone);
    if (cutsceneLayer) cutsceneLayer.remove();
    document.documentElement.classList.add('sf-cutscene-active');
    cutsceneLayer = el('div', 'sf-cutscene-layer');
    cutsceneLayer.setAttribute('role', 'dialog');
    cutsceneLayer.setAttribute('aria-label', cutscene.name || 'Cut scene');
    var built = buildScreen('sf-cutscene', frames[0].image);
    built.frame.style.backgroundImage = '';
    var panel = el('div', 'sf-cutscene-panel');
    var caption = el('p', 'sf-cutscene-text');
    caption.setAttribute('aria-live', 'polite');
    panel.appendChild(caption);
    var controls = el('div', 'sf-cutscene-controls');
    var dots = el('div', 'sf-cutscene-dots');
    frames.forEach(function () { dots.appendChild(el('span', 'sf-cutscene-dot')); });
    if (frames.length > 1) controls.appendChild(dots);
    var next = el('button', 'sf-btn sf-btn-pixel', 'Next ▸');
    var skip = el('button', 'sf-btn sf-btn-pixel', 'Skip ▸▸');
    skip.title = 'Skip (Esc)';
    controls.appendChild(next);
    controls.appendChild(skip);
    panel.appendChild(controls);
    built.screen.appendChild(panel);
    cutsceneLayer.appendChild(built.screen);
    document.body.appendChild(cutsceneLayer);

    var index = -1;
    var timer = null;
    var done = false;
    var shot = null;
    // The key or click that started the scene must not also skip its frames.
    var inputReadyAt = 0;

    function show(i) {
      index = i;
      var frame = frames[i];
      clearTimeout(timer);
      sizeArtwork(built.frame, frame.image);
      var old = shot;
      shot = el('div', 'sf-cutscene-shot');
      shot.style.setProperty('--sf-frame-ms', (frame.durationMs || 4000) + 700 + 'ms');
      if (frame.image) shot.style.backgroundImage = 'url("' + frame.image + '")';
      built.frame.appendChild(shot);
      void shot.offsetWidth;
      shot.classList.add('sf-shown', 'sf-drift');
      if (old) setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 800);
      caption.textContent = frame.text || '';
      caption.style.animation = 'none';
      void caption.offsetWidth;
      caption.style.animation = '';
      if (frame.text) dialogLog.push({ speaker: 'Narrator', text: frame.text });
      Array.prototype.forEach.call(dots.children, function (d, n) { d.classList.toggle('sf-on', n <= i); });
      next.textContent = i === frames.length - 1 ? (cutscene.endsGame ? 'Finish ▸' : 'Continue ▸') : 'Next ▸';
      inputReadyAt = Date.now() + (i === 0 ? 500 : 250);
      timer = setTimeout(function () { step(); }, frame.durationMs || 4000);
    }
    function advance() {
      if (Date.now() < inputReadyAt) return;
      step();
    }
    function step() {
      if (done) return;
      if (index < frames.length - 1) show(index + 1);
      else end();
    }
    function end() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      window.removeEventListener('keydown', onKey, true);
      document.documentElement.classList.remove('sf-cutscene-active');
      if (cutsceneLayer) { cutsceneLayer.remove(); cutsceneLayer = null; }
      finishCutscene(cutscene, onDone);
    }
    function onKey(ev) {
      if (ev.repeat) { ev.preventDefault(); ev.stopPropagation(); return; }
      if (ev.key === 'Escape') { if (Date.now() >= inputReadyAt) end(); }
      else if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowRight') advance();
      else return;
      ev.preventDefault();
      ev.stopPropagation();
    }
    next.onclick = function (ev) { ev.stopPropagation(); advance(); };
    skip.onclick = function (ev) { ev.stopPropagation(); if (Date.now() >= inputReadyAt) end(); };
    built.frame.onclick = advance;
    window.addEventListener('keydown', onKey, true);
    show(0);
    next.focus({ preventScroll: true });
  }

  function finishCutscene(cutscene, onDone) {
    if (cutscene.endsGame) showEnding(cutscene);
    else onDone();
  }

  function showEnding(cutscene) {
    // A finished story starts fresh next time instead of resuming mid-credits.
    clearSave();
    document.removeEventListener('keydown', onGlobalKey);
    document.documentElement.classList.add('sf-ending-active');
    var frames = (cutscene.frames || []).filter(function (f) { return f.image; });
    root.innerHTML = '';
    var built = buildScreen('sf-ending', frames.length ? frames[frames.length - 1].image : G.title.image);
    var panel = el('div', 'sf-intro-panel');
    panel.appendChild(el('h2', 'sf-ending-heading', cutscene.endingHeading || 'The End'));
    if (cutscene.endingText) panel.appendChild(el('p', 'sf-intro-text', cutscene.endingText));
    var again = el('button', 'sf-btn sf-btn-pixel', 'Play Again');
    again.onclick = function () {
      document.documentElement.classList.remove('sf-ending-active');
      state.roomId = G.startRoomId;
      state.inventory = (G.initialInventory || []).filter(function (id) { return itemsById[id]; });
      state.taken = {};
      state.unlocked = {};
      state.visited = {};
      state.flags = {};
      dialogLog = [];
      selectedItemId = null;
      showTitle();
    };
    panel.appendChild(again);
    built.screen.appendChild(panel);
    root.appendChild(built.screen);
    again.focus({ preventScroll: true });
  }

  // ── Command parser (local, no AI — works in exports) ──────────────────────

  var VERB_WORDS = {
    look: ['look', 'examine', 'inspect', 'read', 'check', 'study'],
    use: ['use', 'open', 'take', 'grab', 'pick', 'push', 'pull', 'press', 'operate', 'get'],
    talk: ['talk', 'speak', 'ask', 'say', 'greet', 'chat'],
    kick: ['kick', 'hit', 'punch', 'smash', 'break'],
  };
  var GO_WORDS = ['go', 'walk', 'enter', 'exit', 'leave', 'move', 'head'];

  function runCommand(text) {
    var lower = text.toLowerCase();
    var words = lower.split(/\s+/);
    var room = currentRoom();

    // "use X on Y" — item combo
    var comboMatch = lower.match(/(?:use|put|give)\s+(.+?)\s+(?:on|with|to)\s+(.+)/);
    if (comboMatch) {
      var item = bestMatch(comboMatch[1], state.inventory.map(function (id) { return { key: id, name: itemsById[id] ? itemsById[id].name : id }; }));
      var target = bestMatch(comboMatch[2], visibleHotspots().map(function (h) { return { key: h.id, name: h.name }; }));
      if (item && target) {
        var hs = findHotspot(target.key);
        useItemOn(hs, item.key);
        return;
      }
      showNarration('Narrator', item ? "You don't see that here." : "You aren't carrying that.");
      return;
    }

    // movement
    if (GO_WORDS.indexOf(words[0]) !== -1) {
      var rest = words.slice(1).join(' ').replace(/^(to|the|through|into)\s+/g, '');
      var exits = visibleHotspots().filter(function (h) { return h.kind === 'exit'; });
      var exact = bestMatch(rest, exits.map(function (h) { return { key: h.id, name: h.name }; }));
      // Also allow matching the destination room's name ("go to the library").
      if (!exact) {
        exact = bestMatch(
          rest,
          exits
            .filter(function (h) { return h.targetRoomId && roomsById[h.targetRoomId]; })
            .map(function (h) { return { key: h.id, name: roomsById[h.targetRoomId].name }; })
        );
      }
      if (exact) { tryExit(findHotspot(exact.key)); return; }
      if (exits.length === 1) { tryExit(exits[0]); return; }
      showNarration('Narrator', exits.length ? 'Which way? Try naming the exit.' : "There's no obvious way out of here.");
      return;
    }

    // verb + target
    for (var verb in VERB_WORDS) {
      if (VERB_WORDS[verb].indexOf(words[0]) !== -1) {
        var targetText = words.slice(1).join(' ').replace(/^(at|the|on|to|with)\s+/g, '').replace(/\b(at|the)\b/g, '').trim();
        if (!targetText) {
          showNarration('Narrator', capitalize(words[0]) + ' at what?');
          return;
        }
        var found = bestMatch(targetText, visibleHotspots().map(function (h) { return { key: h.id, name: h.name }; }));
        if (found) {
          performVerb(findHotspot(found.key), verb);
          return;
        }
        // Maybe they're referring to an inventory item.
        var invMatch = bestMatch(targetText, state.inventory.map(function (id) { return { key: id, name: itemsById[id] ? itemsById[id].name : id }; }));
        if (invMatch && verb === 'look') {
          var invItem = itemsById[invMatch.key];
          showNarration('Narrator', invItem.description || 'Your ' + invItem.name.toLowerCase() + '.');
          return;
        }
        showNarration('Narrator', "You don't see that here.");
        return;
      }
    }

    // bare hotspot name → look
    var bare = bestMatch(lower, visibleHotspots().map(function (h) { return { key: h.id, name: h.name }; }));
    if (bare) { performVerb(findHotspot(bare.key), 'look'); return; }

    showNarration('Narrator', "You're not sure how to do that. Try: look, use, talk, kick, or go.");

    function findHotspot(id) {
      return room.hotspots.filter(function (h) { return h.id === id; })[0];
    }
  }

  function visibleHotspots() {
    return currentRoom().hotspots.filter(isVisible);
  }

  /** Fuzzy match: exact name > name contains query > query contains a name word. */
  function bestMatch(query, candidates) {
    query = query.trim().toLowerCase();
    if (!query) return null;
    var exact = null, partial = null;
    candidates.forEach(function (c) {
      var name = c.name.toLowerCase();
      if (name === query) exact = exact || c;
      else if (name.indexOf(query) !== -1 || query.indexOf(name) !== -1) partial = partial || c;
      else {
        var wordsIn = name.split(/\s+/);
        for (var i = 0; i < wordsIn.length; i++) {
          if (wordsIn[i].length > 2 && query.indexOf(wordsIn[i]) !== -1) { partial = partial || c; break; }
        }
      }
    });
    return exact || partial;
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ── Boot ──────────────────────────────────────────────────────────────────

  if (window.parent !== window) {
    window.parent.postMessage({ type: 'safar:ready' }, '*');
  }
  showTitle();
})();

</script>
</body>
