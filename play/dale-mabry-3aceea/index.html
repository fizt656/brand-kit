<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dale Mabry &amp; Eggrish</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<style>
/* Safar engine styles. Shared verbatim by builder preview and export.
   Themed via --sf-accent / --sf-bg / --sf-font / --sf-ratio set by runtime.js
   from the game's StyleConfig — no hardcoded brand aesthetics. */

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--sf-bg, #0f172a);
  font-family: var(--sf-font, system-ui, sans-serif);
  color: #f4f4f5;
  overflow: hidden;
}

/* Optional project atmosphere. These fixed, pointer-free layers create the
   CRT impression without distorting or filtering readable text. */
html.sf-atmosphere-subtle body::before,
html.sf-atmosphere-full body::before,
html.sf-atmosphere-subtle body::after,
html.sf-atmosphere-full body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
}
html.sf-atmosphere-subtle body::before {
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.035), rgba(0,0,0,.035) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse 108% 96% at center, transparent 58%, rgba(0,0,0,.2) 91%, rgba(0,0,0,.32));
}
html.sf-atmosphere-full body::before {
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.075), rgba(0,0,0,.075) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse 108% 96% at center, transparent 52%, rgba(0,0,0,.28) 88%, rgba(0,0,0,.48));
  box-shadow: inset 0 0 38px rgba(0,0,0,.32), inset 0 0 3px color-mix(in srgb, var(--sf-accent) 14%, transparent);
}
html.sf-atmosphere-subtle body::after,
html.sf-atmosphere-full body::after {
  height: 10px;
  bottom: auto;
  opacity: .42;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--sf-accent) 7%, transparent), transparent);
  transform: translateY(-12px);
  animation: sf-raster-drift 13s cubic-bezier(.45,0,.55,1) infinite;
}
html.sf-atmosphere-full body::after { opacity: .7; animation-duration: 9s; }

.sf-root { width: 100%; height: 100%; }

.sf-busy { cursor: progress; }
.sf-using-item .sf-hotspot { cursor: crosshair; }

.sf-hidden { display: none !important; }

/* ── Screens: image-proportioned frames, with controls below artwork. ── */
.sf-screen {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem clamp(.5rem, 2vw, 1.5rem);
  overflow: hidden;
}
.sf-screen-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(20px) brightness(.3) saturate(.8);
  transform: scale(1.12);
}
.sf-screen-frame {
  position: relative;
  width: 100%;
  max-width: 1200px;
  aspect-ratio: var(--sf-image-ratio, var(--sf-ratio, 16 / 9));
  max-height: calc(100vh - 9.5rem);
  border-radius: 14px;
  overflow: hidden;
  /* contain, not cover: screen art must never be cropped, even when its
     aspect ratio doesn't match the project's (e.g. imported v1 images) */
  background: #000 center / contain no-repeat;
  box-shadow: 0 12px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
html.sf-atmosphere-subtle .sf-screen-frame,
html.sf-atmosphere-subtle .sf-scene,
html.sf-atmosphere-full .sf-screen-frame,
html.sf-atmosphere-full .sf-scene {
  border-radius: 18px / 14px;
  box-shadow:
    0 12px 48px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.08),
    inset 0 0 28px rgba(0,0,0,.22),
    inset 0 0 2px color-mix(in srgb, var(--sf-accent) 18%, transparent);
}
.sf-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,.15) 55%, rgba(0,0,0,.35));
}
.sf-title-panel, .sf-intro-panel {
  position: relative;
  text-align: center;
  padding: 0 2rem 2.5rem;
  max-width: 720px;
  max-height: 100%;
  overflow-y: auto;
  animation: sf-rise .8s ease-out both;
}
.sf-title-heading {
  font-size: clamp(2rem, 6vw, 3.75rem);
  font-weight: 700;
  letter-spacing: .02em;
  text-shadow: 0 2px 24px rgba(0,0,0,.8);
}
.sf-title-sub {
  margin-top: .75rem;
  font-size: clamp(.95rem, 2vw, 1.2rem);
  opacity: .85;
  text-shadow: 0 1px 12px rgba(0,0,0,.9);
}
.sf-title-audio {
  display: block;
  margin: 1rem auto -1rem;
  padding: .42rem .7rem;
  border: 1px solid color-mix(in srgb, var(--sf-accent) 45%, transparent);
  border-radius: 4px;
  background: rgba(0,0,0,.38);
  color: color-mix(in srgb, var(--sf-accent) 82%, white);
  font-family: inherit;
  font-size: .68rem;
  letter-spacing: .16em;
  cursor: pointer;
  text-shadow: 0 0 9px color-mix(in srgb, var(--sf-accent) 35%, transparent);
  transition: transform .18s cubic-bezier(.16,1,.3,1), background .18s cubic-bezier(.16,1,.3,1);
}
.sf-title-audio:hover { transform: translateY(-1px); background: rgba(0,0,0,.56); }
.sf-title-buttons { margin-top: 2rem; display: flex; gap: .75rem; justify-content: center; }
.sf-intro-text {
  font-size: clamp(1rem, 2.2vw, 1.3rem);
  line-height: 1.7;
  margin-bottom: 2rem;
  text-shadow: 0 1px 12px rgba(0,0,0,.9);
  white-space: pre-wrap;
}

.sf-btn {
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  padding: .8rem 2.2rem;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.08);
  color: #fff;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: transform .15s, background .15s, box-shadow .15s;
}
.sf-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,.16); }
.sf-btn-primary {
  background: var(--sf-accent);
  border-color: transparent;
  color: #111;
  box-shadow: 0 4px 24px color-mix(in srgb, var(--sf-accent) 45%, transparent);
}
.sf-btn-primary:hover { background: var(--sf-accent); filter: brightness(1.1); }

/* ── Frame layout ── */
.sf-frame {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: .5rem clamp(.5rem, 2vw, 1.5rem);
  gap: .5rem;
}
.sf-frame { overflow-y: auto; }
.sf-frame > :not(.sf-scene-space) { flex-shrink: 0; }
/* Reserve space for text and controls, then fit art without changing the
   hotspot coordinate system. Container height follows the remaining space. */
.sf-scene-space {
  flex: 1;
  min-height: 4rem;
  width: 100%;
  container-type: size;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sf-topbar {
  width: 100%;
  max-width: 1200px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .25rem .25rem 0;
}
.sf-topbar-title { font-weight: 600; font-size: .9rem; opacity: .7; letter-spacing: .04em; }
.sf-topbar-right { display: flex; gap: .4rem; }
.sf-iconbtn {
  font-size: .95rem;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  color: #fff;
  border-radius: 8px;
  width: 2rem;
  height: 2rem;
  cursor: pointer;
  transition: background .15s;
}
.sf-iconbtn:hover { background: rgba(255,255,255,.15); }

/* ── Scene ── */
.sf-scene {
  position: relative;
  width: 100%;
  max-width: 1200px;
  aspect-ratio: var(--sf-image-ratio, var(--sf-ratio, 16 / 9));
  max-height: calc(100vh - 9.5rem);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 12px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  background: #000;
  flex-shrink: 1;
}
.sf-scene::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 25;
  background: linear-gradient(180deg, transparent 0 45%, color-mix(in srgb, var(--sf-accent) 18%, white) 49%, transparent 53% 100%);
}
.sf-scene-sync::after { animation: sf-sync-slip 260ms cubic-bezier(.2,.8,.2,1) both; }
.sf-scene-enter .sf-scene-image { animation: sf-fadein .6s ease-out both; }
.sf-scene-image {
  position: absolute;
  inset: 0;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
.sf-scene-missing {
  display: flex;
  align-items: center;
  justify-content: center;
  background: repeating-linear-gradient(45deg, #14141c, #14141c 12px, #191924 12px, #191924 24px);
}
.sf-scene-missing-text { opacity: .5; font-size: .95rem; }
.sf-room-label {
  position: absolute;
  top: .75rem;
  left: .75rem;
  font-size: .75rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: .3rem .7rem;
  border-radius: 999px;
  background: rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(6px);
  pointer-events: none;
}

/* ── Hotspots ── */
.sf-hotspot {
  position: absolute;
  padding: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color .15s, background .15s;
}
.sf-hotspot:hover,
.sf-hotspot:focus-visible {
  border-color: color-mix(in srgb, var(--sf-accent) 85%, white);
  background: color-mix(in srgb, var(--sf-accent) 14%, transparent);
  box-shadow: inset 0 0 24px color-mix(in srgb, var(--sf-accent) 18%, transparent);
}
html:not(.sf-atmosphere-clean) .sf-hotspot:active {
  animation: sf-phosphor-hit 320ms cubic-bezier(.16,1,.3,1) both;
}
.sf-hotspot-tag {
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: .72rem;
  font-weight: 600;
  padding: .2rem .55rem;
  border-radius: 6px;
  background: rgba(0,0,0,.78);
  border: 1px solid color-mix(in srgb, var(--sf-accent) 60%, transparent);
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s;
}
.sf-hotspot:hover .sf-hotspot-tag,
.sf-hotspot:focus-visible .sf-hotspot-tag { opacity: 1; }

/* ── Verb wheel ── */
.sf-wheel {
  position: absolute;
  width: 0;
  height: 0;
  z-index: 30;
}
.sf-wheel-name {
  position: absolute;
  top: -96px;
  left: 50%;
  transform: translateX(-50%);
  font-size: .78rem;
  font-weight: 700;
  white-space: nowrap;
  padding: .25rem .7rem;
  border-radius: 999px;
  background: rgba(0,0,0,.85);
  border: 1px solid var(--sf-accent);
  animation: sf-pop .18s ease-out both;
}
.sf-wheel-btn {
  position: absolute;
  left: 0;
  top: 0;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(10,10,16,.88);
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  backdrop-filter: blur(6px);
  /* opacity-only: an animated transform would clobber the inline radial translate */
  animation: sf-fadein .18s ease-out both;
  transition: background .12s, border-color .12s;
}
.sf-wheel-btn:hover {
  background: color-mix(in srgb, var(--sf-accent) 30%, rgba(10,10,16,.9));
  border-color: var(--sf-accent);
}
.sf-wheel-icon { font-size: 1.1rem; line-height: 1; }
.sf-wheel-label { font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; opacity: .85; }

/* ── Narration ── */
.sf-narration {
  position: relative;
  width: 100%;
  max-width: 900px;
  display: flex;
  align-items: flex-start;
  gap: .5rem;
  padding: .8rem 1.1rem;
  border-radius: 12px;
  background: rgba(0,0,0,.62);
  border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(10px);
  animation: sf-rise .25s ease-out both;
  cursor: pointer;
}
.sf-narration-text {
  flex: 1;
  min-width: 0;
  max-height: min(28dvh, 16rem);
  overflow-y: auto;
  overflow-wrap: anywhere;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  font-size: clamp(.95rem, 1.8vw, 1.15rem);
  line-height: 1.6;
  text-align: center;
}
.sf-narration-speaker {
  color: var(--sf-accent);
  font-weight: 700;
  margin-right: .5rem;
}
.sf-narration-speaker::after { content: ':'; }
.sf-narration-dismiss {
  background: none;
  border: none;
  color: rgba(255,255,255,.45);
  cursor: pointer;
  font-size: .85rem;
  padding: .1rem .3rem;
}
.sf-narration-dismiss:hover { color: #fff; }

/* ── History ── */
.sf-history {
  position: fixed;
  inset: 8% 12%;
  z-index: 50;
  background: rgba(8,8,14,.94);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: sf-pop .2s ease-out both;
}
.sf-history-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: .9rem 1.2rem;
  border-bottom: 1px solid rgba(255,255,255,.1);
  font-weight: 700;
}
.sf-history-list { flex: 1; overflow-y: auto; padding: 1rem 1.2rem; }
.sf-history-line { margin-bottom: .7rem; line-height: 1.55; font-size: .92rem; opacity: .92; }
.sf-history-line strong { color: var(--sf-accent); }
.sf-history-empty { opacity: .5; }

/* ── Command bar ── */
.sf-command { width: 100%; max-width: 900px; }
.sf-command-input {
  width: 100%;
  font-family: inherit;
  font-size: .95rem;
  padding: .7rem 1.1rem;
  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--sf-accent) 50%, transparent);
  background: rgba(0,0,0,.7);
  color: #fff;
  outline: none;
}
.sf-command-input::placeholder { color: rgba(255,255,255,.35); }

/* ── Inventory ── */
.sf-inventory {
  width: 100%;
  max-width: 1200px;
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-wrap: wrap;
  padding: .15rem .25rem .4rem;
  min-height: 2.6rem;
}
.sf-inventory-label {
  font-size: .68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  opacity: .45;
}
.sf-inventory-empty { font-size: .8rem; opacity: .35; font-style: italic; }
.sf-inventory-hint { font-size: .75rem; color: var(--sf-accent); }
.sf-item {
  display: flex;
  align-items: center;
  gap: .45rem;
  font-family: inherit;
  font-size: .82rem;
  font-weight: 600;
  color: #fff;
  padding: .4rem .8rem;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.06);
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .15s;
}
.sf-item:hover { background: rgba(255,255,255,.13); transform: translateY(-1px); }
.sf-item-selected {
  border-color: var(--sf-accent);
  background: color-mix(in srgb, var(--sf-accent) 22%, transparent);
  box-shadow: 0 0 14px color-mix(in srgb, var(--sf-accent) 35%, transparent);
}
.sf-item-icon { font-size: 1rem; }

/* ── Animations ── */
@keyframes sf-fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes sf-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes sf-pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
@keyframes sf-raster-drift { to { transform: translateY(100vh); } }
@keyframes sf-sync-slip {
  0% { opacity: 0; transform: translateY(-48%) scaleY(.18); }
  32% { opacity: .7; }
  100% { opacity: 0; transform: translateY(48%) scaleY(.55); }
}
@keyframes sf-phosphor-hit {
  0% { filter: brightness(1.5); }
  100% { filter: none; }
}

@media (prefers-reduced-motion: reduce) {
  html.sf-atmosphere-subtle body::after,
  html.sf-atmosphere-full body::after,
  .sf-scene-sync::after,
  .sf-scene-enter .sf-scene-image,
  .sf-title-panel,
  .sf-intro-panel,
  .sf-wheel-name,
  .sf-wheel-btn,
  .sf-narration,
  .sf-history,
  html:not(.sf-atmosphere-clean) .sf-hotspot:active {
    animation: none !important;
  }
}

@media (max-width: 640px) {
  .sf-item-name { display: none; }
  .sf-history { inset: 4%; }
}

/* Artwork determines the canvas, so percentage hotspots share the editor's coordinates. */
.sf-scene, .sf-screen-frame {
  width: min(100%, calc((100dvh - 9.5rem) * var(--sf-image-ratio, 1.777778)));
  flex-shrink: 0;
}
.sf-scene-space .sf-scene {
  width: min(100%, calc(100cqh * var(--sf-image-ratio, 1.777778)));
  max-height: 100%;
}

/* Opening art is presented unfiltered; controls sit below, never over its lettering. */
html.sf-title-active body::before, html.sf-title-active body::after,
html.sf-intro-active body::before, html.sf-intro-active body::after { display: none; }
.sf-title, .sf-intro { flex-direction: column; justify-content: safe center; gap: 1rem; background: #111; overflow-y: auto; }
html.sf-title-active .sf-title .sf-screen-frame,
html.sf-intro-active .sf-intro .sf-screen-frame {
  width: min(100%, calc((100dvh - 12rem) * var(--sf-image-ratio, 1.777778)));
  max-height: none;
  border-radius: 0;
  box-shadow: none;
}
.sf-title-panel, .sf-intro-panel { padding: 0 .5rem .5rem; flex-shrink: 0; max-height: none; animation: none; }
.sf-intro-text { text-shadow: none; }
.sf-title-buttons { margin-top: 0; flex-wrap: wrap; }
.sf-title-heading, .sf-title-sub { margin-bottom: 1rem; }
.sf-title-audio { margin: 0 auto .75rem; color: #ddd; border-color: #777; text-shadow: none; }
.sf-btn-pixel {
  font-family: ui-monospace, 'Courier New', monospace;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .12em;
  border-radius: 0;
  border: 3px solid #ddd;
  background: #333;
  color: #fff;
  padding: .65rem 1.5rem;
  box-shadow: inset 3px 3px #666, inset -3px -3px #171717, 4px 4px #000;
  backdrop-filter: none;
  transition: none;
}
.sf-btn-pixel:hover { background: #444; transform: none; }
.sf-btn-pixel:focus-visible { outline: 3px solid white; outline-offset: 5px; }
.sf-btn-pixel:active { transform: translate(2px, 2px); box-shadow: inset 3px 3px #171717, inset -3px -3px #666, 2px 2px #000; }

/* ── Cut scenes and ending: full-window sequences in the opening-screen style. ── */
html.sf-cutscene-active body::before, html.sf-cutscene-active body::after,
html.sf-ending-active body::before, html.sf-ending-active body::after { display: none; }
.sf-cutscene-layer {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: #111;
  animation: sf-fadein .35s ease-out both;
}
.sf-cutscene, .sf-ending { flex-direction: column; justify-content: safe center; gap: 1rem; background: #111; overflow-y: auto; }
.sf-cutscene .sf-screen-frame,
.sf-ending .sf-screen-frame {
  width: min(100%, calc((100dvh - 13rem) * var(--sf-image-ratio, 1.777778)));
  max-height: none;
  border-radius: 0;
  box-shadow: none;
  background: #000;
}
.sf-cutscene-shot {
  position: absolute;
  inset: 0;
  background: center / contain no-repeat;
  opacity: 0;
  transition: opacity .7s ease;
}
.sf-cutscene-shot.sf-shown { opacity: 1; }
.sf-cutscene-shot.sf-drift { animation: sf-cutscene-drift var(--sf-frame-ms, 4000ms) linear both; }
.sf-ending .sf-screen-frame { width: min(100%, calc((100dvh - 19rem) * var(--sf-image-ratio, 1.777778))); }
.sf-cutscene-panel { flex-shrink: 0; width: min(100%, 60rem); text-align: center; padding: 0 .5rem .5rem; }
.sf-cutscene-text {
  min-height: 3.4em;
  font-size: clamp(.95rem, 2vw, 1.15rem);
  line-height: 1.7;
  color: #eee;
  white-space: pre-wrap;
  animation: sf-fadein .6s ease-out both;
}
.sf-cutscene-controls { margin-top: .75rem; display: flex; gap: .75rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.sf-cutscene-dots { display: flex; gap: .4rem; margin-right: .5rem; }
.sf-cutscene-dot { width: .55rem; height: .55rem; background: #444; border: 1px solid #777; }
.sf-cutscene-dot.sf-on { background: var(--sf-accent); border-color: var(--sf-accent); }
.sf-cutscene-controls .sf-btn-pixel { font-size: .8rem; padding: .5rem 1.1rem; }
.sf-ending-heading {
  font-family: ui-monospace, 'Courier New', monospace;
  font-size: clamp(1.6rem, 5vw, 2.8rem);
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--sf-accent);
  margin-bottom: .75rem;
}

<body>
<div id="safar-root"></div>
<script src="game-data.js"></script>
<script>
/**
 * Safar adventure-score engine.
 *
 * Original compositions are rendered live with Web Audio. The engine keeps
 * Preview and exported games offline and bit-for-bit identical while adding
 * the things the first tracker pass lacked: shaped instruments, real musical
 * phrases, long-form arrangement, convolution reverb, delay, EQ, and gentle
 * bus compression. No samples, network requests, or third-party runtime.

(function () {
  'use strict';

  var SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11],
    minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10],
    mixolydian: [0, 2, 4, 5, 7, 9, 10],

    },
    'terminal-dream': {
      name: "The Cartographer's Lamp", root: 45, bpm: 72, scale: 'minor', palette: 'storybook',
      family: 'deep-water', pulse: 'straight', seed: 0,
      chords: [0, 5, 2, 6, 3, 5, 4, 0],
      motif: [4, null, 3, 2, null, 1, 0, null, 2, null, 4, 3, 1, null, 0, null],
      swing: .04, reverb: .58,
    },
    'arcade-noir': {
      name: 'Rain on Rue Morgue', root: 49, bpm: 92, scale: 'harmonic-minor', palette: 'noir',
      family: 'kinetic-green', pulse: 'straight', seed: 0,
      chords: [0, 5, 3, 4, 0, 2, 1, 4],
      motif: [0, 1, null, 3, 2, null, 1, 0, null, 4, 3, null, 2, 1, null, 0],

    },
    'after-hours': {

      family: 'deep-water', pulse: 'straight', seed: 0,
      chords: [0, 2, 5, 3, 0, 6, 5, 4],
      motif: [7, null, null, 5, null, 4, 2, null, 3, null, 1, null, 2, null, 0, null],

    },
    'blue-memory': {
      name: 'Blue Memory', root: 48, bpm: 80, scale: 'minor', palette: 'dream',
      family: 'deep-water', pulse: 'straight', seed: 23031994,
      chords: [2, 0, 5, 2, 4, 5, 6, 3],
      motif: [4, null, null, 2, null, 1, null, null, 3, null, 4, null, 2, null, 0, null],
      // A brief, recognizable Aquatic-derived statement. After this four-bar
      // phrase the arranger begins omitting, answering, and redirecting notes.
      phrase: [
        8, null, 7, 4, null, null, null, null, null, null, null, null, null, null, 8, 7,
        8, null, 9, 10, null, null, 9, 8, null, null, 6, null, null, null, null, null,
        7, null, null, 2, null, null, null, null, null, null, null, null, null, null, null, null,
        7, null, null, 2, null, null, null, null, null, null, null, null, null, null, null, null,
      ],
      evolve: true, swing: .01, reverb: .78,
    },
    'emerald-circuit': {
      name: 'Emerald Circuit', root: 48, bpm: 128, scale: 'mixolydian', palette: 'clockwork',
      family: 'kinetic-green', pulse: 'straight', seed: 19910623,
      chords: [0, 3, 0, 4, 5, 3, 4, 0],
      motif: [7, null, 5, 7, 6, null, 4, null, 5, 4, null, 2, 4, 3, null, 0],
      swing: .06, reverb: .28,
    },
    'tideglass-current': {
      name: 'Tideglass Current', root: 41, bpm: 84, scale: 'major', palette: 'storybook',
      family: 'buoyant-current', pulse: 'triplet', seed: 19901121,
      chords: [0, 5, 3, 4, 0, 1, 4, 0],
      motif: [4, null, 5, 6, null, 4, 2, null, 3, 4, null, 0],
      swing: 0, reverb: .56,
    },
    'lantern-leaves': {
      name: 'Lanterns in the Leaves', root: 48, bpm: 104, scale: 'major', palette: 'clockwork',
      family: 'forest-clockwork', pulse: 'straight', seed: 19981121,
      chords: [0, 3, 4, 0, 5, 3, 1, 4],
      motif: [4, null, 7, 4, null, 2, 1, null, 2, 3, 4, null, 3, 2, null, 0],
      swing: .04, reverb: .44,
    },
  };

  var PALETTES = {
    storybook: {
      lead: 'triangle', leadLayer: 'sine', bass: 'triangle', pad: 'sine',
      cutoff: 5200, leadCutoff: 3900, delay: .16, pulse: .18, percussion: .24,
    },
    clockwork: {
      lead: 'square', leadLayer: 'triangle', bass: 'square', pad: 'triangle',
      cutoff: 6100, leadCutoff: 4700, delay: .21, pulse: .34, percussion: .52,
    },
    noir: {
      lead: 'triangle', leadLayer: 'square', bass: 'triangle', pad: 'sine',
      cutoff: 4200, leadCutoff: 3100, delay: .13, pulse: .24, percussion: .48,
    },
    dream: {
      lead: 'sine', leadLayer: 'triangle', bass: 'sine', pad: 'triangle',
      cutoff: 6800, leadCutoff: 5600, delay: .29, pulse: .12, percussion: .12,
    },
  };

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function hz(note) { return 440 * Math.pow(2, (note - 69) / 12); }
  function finite(value, fallback) {
    value = Number(value);
    return isFinite(value) ? value : fallback;
  }
  function scaleNote(base, degree, scale) {
    degree = Math.round(degree || 0);
    var octave = Math.floor(degree / 7);
    var wrapped = ((degree % 7) + 7) % 7;
    return base + scale[wrapped] + octave * 12;
  }

  function normalizeScore(raw) {
    raw = raw || {};
    var scaleName = SCALES[raw.scale] ? raw.scale : 'minor';
    var paletteName = PALETTES[raw.palette] ? raw.palette : 'storybook';
    var familyName = raw.family === 'deep-water' || raw.family === 'kinetic-green' ||
      raw.family === 'buoyant-current' || raw.family === 'forest-clockwork'
      ? raw.family : (paletteName === 'clockwork' ? 'forest-clockwork' : 'deep-water');
    var pulseName = raw.pulse === 'triplet' ? 'triplet' : 'straight';
    var motifLength = pulseName === 'triplet' ? 12 : 16;
    var chords = Array.isArray(raw.chords) ? raw.chords.slice(0, 8) : [];
    var motif = Array.isArray(raw.motif) ? raw.motif.slice(0, motifLength) : [];
    var phrase = Array.isArray(raw.phrase) ? raw.phrase.slice(0, 128) : [];
    while (chords.length < 8) chords.push(0);
    while (motif.length < motifLength) motif.push(null);
    return {
      name: String(raw.name || 'Untitled score'),
      root: Math.round(clamp(finite(raw.root, 48), 36, 59)),
      bpm: Math.round(clamp(finite(raw.bpm, 78), 54, 138)),
      scale: scaleName,
      palette: paletteName,
      family: familyName,
      pulse: pulseName,
      seed: Math.round(clamp(finite(raw.seed, 0), 0, 4294967295)),
      chords: chords.map(function (degree) { return Math.round(clamp(finite(degree, 0), 0, 6)); }),
      motif: motif.map(function (degree) {
        return degree == null ? null : Math.round(clamp(finite(degree, 0), 0, 7));
      }),
      phrase: phrase.map(function (degree) {
        return degree == null ? null : Math.round(clamp(finite(degree, 0), -7, 14));
      }),
      evolve: raw.evolve === true,
      swing: clamp(finite(raw.swing, .06), 0, .24),
      reverb: clamp(finite(raw.reverb, .48), .08, .82),
    };
  }

  function create(config, getContext) {
    config = config || {};
    var selected = config.customScore || PRESETS[config.preset] || PRESETS['midnight-drive'];
    var score = normalizeScore(selected);
    var scale = SCALES[score.scale];
    var palette = PALETTES[score.palette];
    var context = null;
    var musicBus = null;
    var master = null;
    var timer = null;
    var noiseBuffer = null;
    var nextTime = 0;
    var step = 0;
    var started = false;
    var muted = false;

    function level() { return clamp(finite(config.volume, .28), .035, .6); }
    function beatSeconds() { return 60 / score.bpm; }
    function stepsPerBeat() { return score.pulse === 'triplet' ? 3 : 4; }
    function stepsPerBar() { return stepsPerBeat() * 4; }
    function stepSeconds() { return beatSeconds() / stepsPerBeat(); }

    function makeNoise(seconds) {
      var length = Math.ceil(context.sampleRate * seconds);
      if (noiseBuffer && noiseBuffer.length >= length) return noiseBuffer;
      noiseBuffer = context.createBuffer(1, Math.max(length, Math.ceil(context.sampleRate * .24)), context.sampleRate);
      var data = noiseBuffer.getChannelData(0);
      var previous = 0;
      for (var i = 0; i < data.length; i++) {
        previous = previous * .32 + (Math.random() * 2 - 1) * .68;
        data[i] = previous;
      }
      return noiseBuffer;
    }

    function makeImpulse(seconds, decay) {
      var length = Math.floor(context.sampleRate * seconds);
      var impulse = context.createBuffer(2, length, context.sampleRate);
      for (var channel = 0; channel < 2; channel++) {
        var data = impulse.getChannelData(channel);
        var smooth = 0;
        for (var i = 0; i < length; i++) {
          var envelope = Math.pow(1 - i / length, decay);
          smooth = smooth * .22 + (Math.random() * 2 - 1) * .78;
          data[i] = smooth * envelope * (channel ? .91 : 1);
        }
      }
      return impulse;
    }

    function shapedVoice(note, at, duration, options) {
      var oscillator = context.createOscillator();
      var layer = context.createOscillator();
      var layerGain = context.createGain();
      var filter = context.createBiquadFilter();
      var envelope = context.createGain();
      var vibrato = context.createOscillator();
      var vibratoDepth = context.createGain();
      var attack = options.attack || .012;
      var release = options.release || .15;
      var end = at + Math.max(duration, attack + .03);
      var peak = Math.max(.0002, options.volume || .02);

      oscillator.type = options.type || 'triangle';
      layer.type = options.layer || 'sine';
      oscillator.frequency.setValueAtTime(hz(note), at);
      layer.frequency.setValueAtTime(hz(note), at);
      oscillator.detune.value = options.detune || -3;
      layer.detune.value = options.layerDetune || 5;
      layerGain.gain.value = options.layerMix == null ? .28 : options.layerMix;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(options.cutoff || 4800, at);
      filter.Q.value = options.q || .7;
      envelope.gain.setValueAtTime(.0001, at);
      envelope.gain.exponentialRampToValueAtTime(peak, at + attack);
      envelope.gain.exponentialRampToValueAtTime(Math.max(.0002, peak * (options.sustain || .72)), at + attack + .06);
      envelope.gain.setValueAtTime(Math.max(.0002, peak * (options.sustain || .72)), end);
      envelope.gain.exponentialRampToValueAtTime(.0001, end + release);

      vibrato.frequency.value = options.vibratoRate || 5.1;
      vibratoDepth.gain.value = options.vibrato || 0;
      vibrato.connect(vibratoDepth);
      vibratoDepth.connect(oscillator.detune);
      vibratoDepth.connect(layer.detune);
      oscillator.connect(filter);
      layer.connect(layerGain).connect(filter);
      filter.connect(envelope).connect(musicBus);
      oscillator.start(at);
      layer.start(at);
      vibrato.start(at);
      oscillator.stop(end + release + .04);
      layer.stop(end + release + .04);
      vibrato.stop(end + release + .04);
    }

    function lead(note, at, duration, softer) {
      shapedVoice(note, at, duration, {
        type: palette.lead,
        layer: palette.leadLayer,
        volume: softer ? .019 : .028,
        cutoff: palette.leadCutoff,
        q: score.palette === 'noir' ? 1.4 : .8,
        attack: score.palette === 'storybook' ? .025 : .012,
        release: score.palette === 'dream' ? .34 : .17,
        sustain: .68,
        layerMix: score.palette === 'clockwork' ? .16 : .32,
        detune: -4,
        layerDetune: 4,
        vibrato: score.palette === 'storybook' ? 4.2 : 2.1,
      });
    }

    function bass(note, at, duration, ghost) {
      shapedVoice(note, at, duration, {
        type: palette.bass,
        layer: 'sine',
        volume: ghost ? .022 : .043,
        cutoff: score.palette === 'noir' ? 820 : 1150,
        q: .9,
        attack: .008,
        release: .12,
        sustain: .58,
        layerMix: .42,
        detune: -2,
        layerDetune: 2,
      });
    }

    function padChord(degree, at, duration, quiet) {
      var base = score.root + 12;
      var notes = [
        scaleNote(base, degree, scale),
        scaleNote(base, degree + 2, scale),
        scaleNote(base, degree + 4, scale),
      ];
      // Gentle inversions keep consecutive chords from lurching around.
      if (degree >= 4) notes[0] += 12;
      for (var i = 0; i < notes.length; i++) {
        shapedVoice(notes[i], at + i * .009, duration, {
          type: palette.pad,
          layer: i === 1 ? 'triangle' : 'sine',
          volume: quiet ? .009 : .013,
          cutoff: palette.cutoff,
          q: .45,
          attack: score.palette === 'dream' ? .24 : .12,
          release: score.palette === 'dream' ? .75 : .46,
          sustain: .82,
          layerMix: .2,
          detune: -6 + i * 2,
          layerDetune: 5 - i,
        });
      }
    }

    function mallet(note, at, volume) {
      var carrier = context.createOscillator();
      var modulator = context.createOscillator();
      var modDepth = context.createGain();
      var filter = context.createBiquadFilter();
      var envelope = context.createGain();
      var frequency = hz(note);
      var duration = score.palette === 'dream' ? .92 : .42;
      carrier.type = 'sine';
      modulator.type = 'sine';
      carrier.frequency.setValueAtTime(frequency, at);
      modulator.frequency.setValueAtTime(frequency * (score.palette === 'clockwork' ? 3 : 2), at);
      modDepth.gain.setValueAtTime(frequency * .72, at);
      modDepth.gain.exponentialRampToValueAtTime(.01, at + duration * .62);
      modulator.connect(modDepth).connect(carrier.frequency);
      filter.type = 'lowpass';
      filter.frequency.value = palette.cutoff;
      envelope.gain.setValueAtTime(.0001, at);
      envelope.gain.exponentialRampToValueAtTime(volume, at + .006);
      envelope.gain.exponentialRampToValueAtTime(.0001, at + duration);
      carrier.connect(filter).connect(envelope).connect(musicBus);
      carrier.start(at);
      modulator.start(at);
      carrier.stop(at + duration + .03);
      modulator.stop(at + duration + .03);
    }

    function kick(at, volume) {
      var oscillator = context.createOscillator();
      var envelope = context.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(92, at);
      oscillator.frequency.exponentialRampToValueAtTime(43, at + .11);
      envelope.gain.setValueAtTime(volume, at);
      envelope.gain.exponentialRampToValueAtTime(.0001, at + .15);
      oscillator.connect(envelope).connect(musicBus);
      oscillator.start(at);
      oscillator.stop(at + .17);
    }

    function brush(at, volume, bright) {
      var source = context.createBufferSource();
      var filter = context.createBiquadFilter();
      var envelope = context.createGain();
      source.buffer = makeNoise(.22);
      filter.type = bright ? 'highpass' : 'bandpass';
      filter.frequency.value = bright ? 4800 : 1700;
      filter.Q.value = bright ? .35 : .8;
      envelope.gain.setValueAtTime(volume, at);
      envelope.gain.exponentialRampToValueAtTime(.0001, at + (bright ? .045 : .12));
      source.connect(filter).connect(envelope).connect(musicBus);
      source.start(at);
      source.stop(at + .15);
    }

    function phraseDuration(source, index) {
      var count = 1;
      var maximum = source === score.phrase ? stepsPerBeat() * 3 : stepsPerBeat();
      while (count < maximum && source[(index + count) % source.length] == null) count++;
      return stepSeconds() * count * .82;
    }

    function sectionFor(bar) {
      var cycle = bar % 32;
      if (cycle < 2) return 'intro';
      if (cycle < 10) return 'a';
      if (cycle < 18) return 'b';
      if (cycle < 22) return 'break';
      return 'reprise';
    }

    function schedule(rawAt, index) {
      var perBeat = stepsPerBeat();
      var perBar = stepsPerBar();
      var beat = index % perBar;
      var bar = Math.floor(index / perBar);
      var section = sectionFor(bar);
      var degree = score.chords[bar % score.chords.length];
      var nextDegree = score.chords[(bar + 1) % score.chords.length];
      var at = rawAt + (score.pulse === 'straight' && beat % 2 ? stepSeconds() * score.swing : 0);
      var rootBass = scaleNote(score.root - 12, degree, scale);
      var firstPickup = Math.round(perBeat * 1.5);
      var middle = perBeat * 2;
      var late = perBeat * 3;
      var secondPickup = Math.round(perBeat * 3.5);

      if (beat === 0) {
        padChord(degree, at, beatSeconds() * 3.55, section === 'intro' || section === 'break');
        bass(rootBass, at, beatSeconds() * (section === 'break' ? 1.4 : .82), false);
        if (section !== 'intro' && score.palette !== 'dream') kick(at, .018 * palette.percussion);
      }

      if (section !== 'intro' && section !== 'break') {
        if (beat === firstPickup) bass(scaleNote(score.root - 12, degree + 4, scale), at, beatSeconds() * .38, true);
        if (beat === middle) bass(rootBass + (bar % 2 ? 0 : 12), at, beatSeconds() * .62, false);
        if (beat === late && section !== 'a') {
          bass(scaleNote(score.root - 12, nextDegree - 1, scale), at, beatSeconds() * .3, true);
        }
        if (score.family === 'kinetic-green' && beat === perBeat - 1) {
          bass(scaleNote(score.root - 12, degree + 2, scale), at, beatSeconds() * .22, true);
        }
      }

      if (palette.percussion > .15 && section !== 'intro') {
        if (beat === firstPickup || beat === secondPickup) brush(at, .013 * palette.percussion, false);
        if ((score.palette === 'clockwork' || score.palette === 'noir') && beat % perBeat === Math.floor(perBeat / 2)) {
          brush(at, .007 * palette.percussion, true);
        }
      }

      var hasLongPhrase = score.phrase.length > 0;
      var phraseSource = hasLongPhrase ? score.phrase : score.motif;
      var absolutePhraseStep = bar * perBar + beat;
      var motifIndex = hasLongPhrase ? absolutePhraseStep % phraseSource.length : beat % phraseSource.length;
      var motifDegree = phraseSource[motifIndex];
      if (!hasLongPhrase && bar % 2 === 1) {
        motifIndex = (beat + perBeat) % phraseSource.length;
        motifDegree = phraseSource[motifIndex];
        if (motifDegree != null && beat >= middle) motifDegree = Math.max(0, motifDegree - 1);
      }
      if (hasLongPhrase && score.evolve) {
        var phraseCycle = Math.floor(absolutePhraseStep / phraseSource.length);
        if (phraseCycle > 0 && motifDegree != null) {
          if ((motifIndex + phraseCycle * 5) % 19 === 0) motifDegree = null;
          else if ((motifIndex + phraseCycle * 7) % 23 === 0) {
            motifDegree = clamp(motifDegree + (phraseCycle % 2 ? -1 : 1), -7, 14);
          }
        }
      }
      var allowLead = hasLongPhrase || section !== 'intro' || (bar % 32 === 1 && beat >= middle);
      if (!hasLongPhrase && section === 'break') allowLead = beat === 0 || beat === middle;
      if (motifDegree != null && allowLead) {
        var lift = !hasLongPhrase && section === 'b' && (bar % 4 >= 2) ? 2 : 0;
        var leadNote = scaleNote(score.root + 12, motifDegree + lift, scale);
        lead(leadNote, at, phraseDuration(phraseSource, motifIndex), section === 'intro' || section === 'break');
      }

      // A small answer voice makes the loop feel arranged instead of merely
      // repeated. It stays out of the opening and breakdown so the score breathes.
      if ((section === 'b' || section === 'reprise') && (beat === perBeat - 1 || beat === late - 1)) {
        var answerDegree = degree + (beat === perBeat - 1 ? 4 : 2);
        mallet(scaleNote(score.root + 12, answerDegree, scale), at, score.palette === 'dream' ? .018 : .012);
      } else if (section === 'a' && score.family === 'forest-clockwork' &&
        (beat === Math.floor(perBeat / 2) || beat === middle + Math.floor(perBeat / 2))) {
        mallet(scaleNote(score.root + 12, degree + 2, scale), at, .009);
      }

      if (score.family === 'buoyant-current' && section !== 'intro' && beat % perBeat === 1) {
        mallet(scaleNote(score.root + 12, degree + (Math.floor(beat / perBeat) % 2 ? 4 : 2), scale), at, .008);
      } else if (score.family === 'deep-water' && beat === secondPickup && bar % 4 === 3) {
        mallet(scaleNote(score.root + 24, degree + 4, scale), at, .008);
      }
    }

    function tick() {
      if (!context) return;
      var seconds = stepSeconds();
      while (nextTime < context.currentTime + .16) {
        schedule(nextTime, step++);
        nextTime += seconds;
      }
    }

    function ensureGraph() {
      if (master) return;
      context = getContext();
      musicBus = context.createGain();
      var dry = context.createGain();
      var reverb = context.createConvolver();
      var reverbGain = context.createGain();
      var delay = context.createDelay(1.2);
      var feedback = context.createGain();
      var delayGain = context.createGain();
      var highpass = context.createBiquadFilter();
      var lowShelf = context.createBiquadFilter();
      var presence = context.createBiquadFilter();
      var highShelf = context.createBiquadFilter();
      var compressor = context.createDynamicsCompressor();
      master = context.createGain();

      dry.gain.value = .92;
      reverb.buffer = makeImpulse(score.palette === 'dream' ? 2.8 : 2.15, score.palette === 'dream' ? 3.1 : 3.8);
      reverbGain.gain.value = score.reverb * .34;
      delay.delayTime.value = beatSeconds() * .75;
      feedback.gain.value = .13 + palette.delay * .18;
      delayGain.gain.value = palette.delay;

      highpass.type = 'highpass';
      highpass.frequency.value = 32;
      highpass.Q.value = .55;
      lowShelf.type = 'lowshelf';
      lowShelf.frequency.value = 180;
      lowShelf.gain.value = -1.2;
      presence.type = 'peaking';
      presence.frequency.value = 1850;
      presence.Q.value = .72;
      presence.gain.value = -1.5;
      highShelf.type = 'highshelf';
      highShelf.frequency.value = 6200;
      highShelf.gain.value = score.palette === 'dream' ? -1.2 : -3.1;
      compressor.threshold.value = -19;
      compressor.knee.value = 16;
      compressor.ratio.value = 3.2;
      compressor.attack.value = .012;
      compressor.release.value = .24;

      musicBus.connect(dry).connect(highpass);
      musicBus.connect(reverb).connect(reverbGain).connect(highpass);
      musicBus.connect(delay);
      delay.connect(feedback).connect(delay);
      delay.connect(delayGain).connect(highpass);
      highpass.connect(lowShelf).connect(presence).connect(highShelf).connect(compressor).connect(master);
      master.connect(context.destination);
      master.gain.value = muted ? 0 : level();
    }

    return {
      start: function (isMuted) {
        muted = !!isMuted;
        if (started) {
          if (!muted && context && context.state === 'suspended') context.resume().catch(function () {});
          return;
        }
        started = true;
        ensureGraph();
        context.resume().catch(function () {});
        nextTime = context.currentTime + .045;
        step = 0;
        tick();
        timer = window.setInterval(tick, 45);
      },
      setMuted: function (isMuted) {
        muted = !!isMuted;
        if (!started && !muted) this.start(false);
        if (context && !muted && context.state === 'suspended') context.resume().catch(function () {});
        if (master) master.gain.setTargetAtTime(muted ? 0 : level(), context.currentTime, .035);
      },
      setVolume: function (volume) {
        config.volume = volume;
        if (master && !muted) master.gain.setTargetAtTime(level(), context.currentTime, .035);
      },
      stop: function () {
        if (timer != null) window.clearInterval(timer);
        timer = null;
        if (master && context) {
          master.gain.cancelScheduledValues(context.currentTime);
          master.gain.setTargetAtTime(0, context.currentTime, .025);
          var oldMaster = master;
          window.setTimeout(function () { try { oldMaster.disconnect(); } catch (error) {} }, 180);
        }
        started = false;
      },
    };
  }

  window.SafarSynth = { create: create };
})();

<script>
/**
 * Safar game engine. One file, no dependencies, no build step.
 *
 * This exact script is BOTH the builder preview and the exported player, so
 * the two can never drift apart. It reads `window.SAFAR_GAME` (see GameData
 * in types.ts) and renders the full game: title → intro → scenes with
 * hotspots, verb wheel, inventory, combos, trades, story flags, a phone
 * dial pad, cut scenes, an ending, command bar, narration, music, and saves.
 *
 * Response resolution order for any interaction:
 *   1. Baked responses in the game data (exports rely on these)
 *   2. Live AI bridge via postMessage (builder preview only)
 *   3. Deterministic fallback lines (never a dead click)
 */
(function safarMain() {
  'use strict';

  var G = window.SAFAR_GAME;
  if (!G) {
    document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;padding:2rem">Missing game data.</p>';
    return;
  }

  // Preview hands large images and music over as Blobs instead of inlining
  // them into the document, then the game starts with local object URLs.
  if (G.assetHandoff && !G.assetsReady) {
    window.addEventListener('message', function receiveAssets(ev) {
      if (ev.source !== window.parent || !ev.data || ev.data.type !== 'safar:assets') return;
      window.removeEventListener('message', receiveAssets);
      var assets = ev.data.assets || {};
      var urls = {};
      Object.keys(assets).forEach(function (id) {
        try { urls[id] = URL.createObjectURL(assets[id]); } catch (e) { /* missing art shows its placeholder */ }
      });
      (function swap(node) {
        Object.keys(node).forEach(function (key) {
          var value = node[key];
          if (typeof value === 'string' && value.indexOf('safar-asset:') === 0) node[key] = urls[value.slice(12)];
          else if (value && typeof value === 'object') swap(value);
        });
      })(G);
      G.assetsReady = true;
      safarMain();
    });
    window.parent.postMessage({ type: 'safar:need-assets' }, '*');
    return;
  }

  // ── Utilities ─────────────────────────────────────────────────────────────

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  // Sandboxed previews receive a parent-provided snapshot and bridge writes
  // back through postMessage. Standalone exports use localStorage directly.
  var memoryStore = Object.assign({}, G.previewStorage || {});
  function bridgeStorage(operation, key, value) {
    if (!G.previewBridge || !window.parent || window.parent === window) return;
    window.parent.postMessage({
      type: 'safar:storage',
      payload: { operation: operation, key: key, value: value },
    }, '*');
  }
  var storage = {
    get: function (k) {
      if (G.previewBridge) return memoryStore[k] || null;
      try { return localStorage.getItem(k); } catch (e) { return memoryStore[k] || null; }
    },
    set: function (k, v) {
      if (G.previewBridge) {
        memoryStore[k] = v;
        bridgeStorage('set', k, v);
        return;
      }
      try { localStorage.setItem(k, v); } catch (e) { memoryStore[k] = v; }
    },
    remove: function (k) {
      if (G.previewBridge) {
        delete memoryStore[k];
        bridgeStorage('remove', k);
        return;
      }
      try { localStorage.removeItem(k); } catch (e) { delete memoryStore[k]; }
    },
  };

  var roomsById = {};
  G.rooms.forEach(function (r) { roomsById[r.id] = r; });
  var itemsById = {};
  G.items.forEach(function (it) { itemsById[it.id] = it; });
  var cutscenesById = {};
  (G.cutscenes || []).forEach(function (c) { cutscenesById[c.id] = c; });

  var LEGACY_SAVE_KEY = 'safar.save.' + (G.meta.name || 'game');
  var SAVE_KEY = 'safar.save.v2.' + (G.meta.id || G.meta.name || 'game');
  // Preserve Continue data created by early v2 builds, then use the stable
  // project ID so renaming does not orphan a save.
  if (SAVE_KEY !== LEGACY_SAVE_KEY && !storage.get(SAVE_KEY) && storage.get(LEGACY_SAVE_KEY)) {
    storage.set(SAVE_KEY, storage.get(LEGACY_SAVE_KEY));
    storage.remove(LEGACY_SAVE_KEY);
  }
  if (!storage.get(SAVE_KEY + '.muted') && storage.get(LEGACY_SAVE_KEY + '.muted')) {
    storage.set(SAVE_KEY + '.muted', storage.get(LEGACY_SAVE_KEY + '.muted'));
    storage.remove(LEGACY_SAVE_KEY + '.muted');
  }

  // ── Game state ────────────────────────────────────────────────────────────

  var state = {
    roomId: G.startRoomId,
    inventory: (G.initialInventory || []).filter(function (id) { return itemsById[id]; }),
    taken: {},            // hotspotId -> true (picked-up items disappear)
    unlocked: {},         // hotspotId -> true (requiredItem satisfied)
    visited: {},          // roomId -> true
    flags: {},            // story flag -> true
    muted: storage.get(SAVE_KEY + '.muted') === '1',
  };

  function saveGame() {
    storage.set(SAVE_KEY, JSON.stringify({
      version: 2,
      roomId: state.roomId,
      inventory: state.inventory,
      taken: state.taken,
      unlocked: state.unlocked,
      visited: state.visited,
      flags: state.flags,
    }));
  }

  function loadGame() {
    var raw = storage.get(SAVE_KEY);
    if (!raw) return false;
    try {
      var s = JSON.parse(raw);
      if (!roomsById[s.roomId]) return false;
      state.roomId = s.roomId;
      state.inventory = (s.inventory || []).filter(function (id) { return itemsById[id]; });
      state.taken = s.taken || {};
      state.unlocked = s.unlocked || {};
      state.visited = s.visited || {};
      state.flags = s.flags || {};
      return true;
    } catch (e) {
      return false;
    }
  }

  function hasSave() { return !!storage.get(SAVE_KEY); }

  function clearSave() { storage.remove(SAVE_KEY); }

  // ── Live AI bridge (builder preview only) ─────────────────────────────────

  var bridgeSeq = 0;
  var bridgeWaiters = {};

  if (G.liveBridge) {
    window.addEventListener('message', function (ev) {
      if (ev.source !== window.parent) return;
      var msg = ev.data;
      if (!msg || msg.type !== 'safar:result') return;
      var waiter = bridgeWaiters[msg.requestId];
      if (waiter) {
        delete bridgeWaiters[msg.requestId];
        waiter(typeof msg.text === 'string' && msg.text ? msg.text : null);
      }
    });
  }

  /** Ask the parent frame to generate text live. Resolves null on timeout/failure.
   *  The window allows for a hosted model's slower first reply and one retry. */
  function bridgeGenerate(payload) {
    return new Promise(function (resolve) {
      if (!G.liveBridge || !window.parent || window.parent === window) return resolve(null);
      var id = 'req' + (++bridgeSeq);
      bridgeWaiters[id] = resolve;
      var timer = setTimeout(function () {
        if (bridgeWaiters[id]) { delete bridgeWaiters[id]; resolve(null); }
      }, 60000);
      bridgeWaiters[id] = function (text) { clearTimeout(timer); resolve(text); };
      window.parent.postMessage({ type: 'safar:generate', requestId: id, payload: payload }, '*');
    });
  }

  var FALLBACK = {
    look: 'You take a closer look, but nothing more reveals itself.',
    use: 'You fiddle with it. Nothing happens.',
    talk: "No response. Perhaps it's shy.",
    kick: 'You give it a solid kick. Ow. Nothing happens.',
    combo: "That doesn't seem to work.",
    entry: '',
  };

  function resolveVerbText(hotspot, verb) {
    var baked = G.responses.verbs[state.roomId + '/' + hotspot.id + '/' + verb];
    if (baked) return Promise.resolve(baked);
    return bridgeGenerate({ kind: 'verb', roomId: state.roomId, hotspotId: hotspot.id, verb: verb })
      .then(function (text) { return text || FALLBACK[verb]; });
  }

  function resolveComboText(hotspot, itemId, unlocks) {
    var baked = G.responses.combos[state.roomId + '/' + hotspot.id + '/' + itemId];
    if (baked) return Promise.resolve(baked);
    return bridgeGenerate({ kind: 'combo', roomId: state.roomId, hotspotId: hotspot.id, itemId: itemId, unlocks: unlocks })
      .then(function (text) {
        if (text) return text;
        return unlocks ? 'It works! The ' + hotspot.name.toLowerCase() + ' yields.' : FALLBACK.combo;
      });
  }

  function resolveEntryText(room) {
    if (room.entryMode === 'none') return Promise.resolve('');
    if (room.entryMode === 'custom') return Promise.resolve(room.entryText || '');
    var baked = G.responses.entry[room.id];
    if (baked) return Promise.resolve(baked);
    return bridgeGenerate({ kind: 'entry', roomId: room.id }).then(function (t) { return t || ''; });
  }

  // ── DOM scaffold ──────────────────────────────────────────────────────────

  var root = document.getElementById('safar-root') || document.body;
  root.classList.add('sf-root');
  document.documentElement.style.setProperty('--sf-accent', G.meta.accent || '#fbbf24');
  document.documentElement.style.setProperty('--sf-bg', G.meta.background || '#0f172a');
  document.documentElement.style.setProperty(
    '--sf-font',
    G.meta.font === 'serif' ? "Georgia, 'Times New Roman', serif"
      : G.meta.font === 'mono' ? "'Courier New', monospace"
      : "system-ui, -apple-system, 'Segoe UI', sans-serif"
  );
  var ratio = (G.meta.aspectRatio || '16:9').split(':');
  document.documentElement.style.setProperty('--sf-ratio', (ratio[0] || 16) + ' / ' + (ratio[1] || 9));
  var atmosphere = G.meta.atmosphere === 'full' || G.meta.atmosphere === 'clean'
    ? G.meta.atmosphere
    : 'subtle';
  document.documentElement.classList.add('sf-atmosphere-' + atmosphere);

  var audioContext = null;
  function getAudioContext() {
    audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    return audioContext;
  }

  var music = null;
  if (G.music) {
    music = new Audio(G.music);
    music.loop = true;
    music.volume = 0.5;
  }
  var synthMusic = null;
  if (!music && G.synthScore && G.synthScore.preset && G.synthScore.preset !== 'off' && window.SafarSynth) {
    synthMusic = window.SafarSynth.create(G.synthScore, getAudioContext);
  }
  var muteBtn = null;
  var titleAudioBtn = null;
  var audioUnlocked = false;
  var audioUnlockArmed = false;

  function updateAudioButtons() {
    if (muteBtn) muteBtn.textContent = state.muted ? '🔇' : '🔊';
    if (titleAudioBtn) {
      titleAudioBtn.textContent = state.muted
        ? '♫ SOUND OFF'
        : audioUnlocked ? '♫ SOUND ON' : '♫ ENABLE SCORE';
    }
  }

  function markAudioUnlocked() {
    audioUnlocked = true;
    updateAudioButtons();
  }

  function playUploadedMusic() {
    if (!music || state.muted) return;
    var attempt = music.play();
    if (attempt && attempt.then) attempt.then(markAudioUnlocked).catch(function () {});
  }

  function startUploadedMusic() {
    playUploadedMusic();
  }

  function unlockMusic() {
    playUploadedMusic();
    if (synthMusic) synthMusic.start(state.muted);
    if (audioContext && !state.muted) {
      audioContext.resume().then(markAudioUnlocked).catch(function () {});
    }
  }

  function armAudioUnlock() {
    if (audioUnlockArmed || state.muted || (!music && !synthMusic)) return;
    audioUnlockArmed = true;
    var unlock = function (event) {
      var target = event.target;
      if (target && target.closest && target.closest('.sf-title-audio')) return;
      window.removeEventListener('pointerdown', unlock, true);
      window.removeEventListener('keydown', unlock, true);
      audioUnlockArmed = false;
      unlockMusic();

    window.addEventListener('pointerdown', unlock, true);
    window.addEventListener('keydown', unlock, true);
  }

  function setMuted(m) {
    state.muted = m;
    storage.set(SAVE_KEY + '.muted', m ? '1' : '0');
    if (music) { if (m) music.pause(); else playUploadedMusic(); }
    if (synthMusic) synthMusic.setMuted(m);
    if (!m && audioContext) audioContext.resume().then(markAudioUnlocked).catch(function () {});
    updateAudioButtons();
  }

  function playUiTone(kind) {
    if (!G.meta.uiSound || state.muted) return;
    try {
      audioContext = getAudioContext();
      var now = audioContext.currentTime;
      var oscillator = audioContext.createOscillator();
      var gain = audioContext.createGain();
      oscillator.type = kind === 'shift' ? 'sine' : 'square';
      oscillator.frequency.setValueAtTime(kind === 'confirm' ? 520 : kind === 'shift' ? 145 : 310, now);
      if (kind === 'confirm') oscillator.frequency.exponentialRampToValueAtTime(760, now + .05);
      if (kind === 'shift') oscillator.frequency.exponentialRampToValueAtTime(210, now + .08);
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(kind === 'shift' ? .014 : .009, now + .004);
      gain.gain.exponentialRampToValueAtTime(.0001, now + (kind === 'shift' ? .11 : .055));
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + .13);
