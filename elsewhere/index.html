<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="theme-color" content="#faf8f3">
  <meta name="description" content="An unlisted room on the other side of Gus Halwani's map.">
  <title>Elsewhere — Gus Halwani</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M12 34c9-19 24 15 40-9' fill='none' stroke='%23a97d32' stroke-width='3'/%3E%3Ccircle cx='20' cy='30' r='3' fill='%23221f1a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="labyrinth.css?v=20260808b">
</head>
<body data-room="threshold" data-theme="paper">
  <a class="skip-link" href="#threshold-title">Skip to the current room</a>
  <div class="material" aria-hidden="true"></div>

  <header class="edge">
    <a class="wordmark" href="/">Gus Halwani, <span>PhD</span></a>
    <div class="edge-actions">
      <button id="sound-toggle" type="button" aria-pressed="false">sound</button>
      <button id="erase-route" type="button">erase</button>
      <a href="/" aria-label="Exit elsewhere">exit</a>
    </div>
  </header>

  <main id="stage">
    <section id="threshold" class="threshold" aria-labelledby="threshold-title">
      <div class="threshold-copy">
        <h1 id="threshold-title">There is another map.</h1>
        <button id="enter-labyrinth" type="button">enter</button>
      </div>
      <button class="threshold-object" id="threshold-object" type="button" aria-label="Enter the other map">
        <svg viewBox="0 0 420 520" role="img" aria-label="An irregular folded brass form">
          <defs>
            <filter id="threshold-warp">
              <feTurbulence type="fractalNoise" baseFrequency=".012 .026" numOctaves="3" seed="17" result="noise"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
            </filter>
          </defs>
          <path class="threshold-object-fill" filter="url(#threshold-warp)" d="M209 34C271 62 331 132 318 203c-11 60-75 75-65 131 7 38 61 67 39 111-19 37-92 50-137 24-42-24-31-82-46-124-18-51-58-85-31-142 26-54 77-194 131-169Z"/>
          <path class="threshold-object-line" d="M102 373c72-58 158-117 184-226M116 420c62-106 111-188 178-256M82 244c92 11 165 57 205 127"/>
        </svg>
      </button>
      <p class="threshold-fault" aria-hidden="true">42.3601 / 33.8938 / —</p>
    </section>

    <section id="labyrinth" class="labyrinth" hidden aria-live="polite">
      <article id="room" class="room">
        <p id="room-index" class="room-index"></p>
        <h2 id="room-title"></h2>
        <p id="room-fragment" class="room-fragment"></p>
        <div id="room-artifact" class="room-artifact"></div>
        <p id="room-response" class="room-response" role="status"></p>
      </article>
      <nav id="doors" class="doors" aria-label="Ways out"></nav>
    </section>
  </main>

  <dialog id="transmission" class="transmission" aria-labelledby="transmission-title">
    <button class="dialog-close" type="button" aria-label="Close">×</button>
    <p id="transmission-title">a recovered line</p>
    <p>eventually the instruments began answering one another.</p>
    <button id="play-transmission" type="button">play</button>
  </dialog>

  <template id="door-template">
    <a class="door" href="#"><span></span></a>
  </template>

  <noscript><p class="noscript">This room needs JavaScript to lose the path. The front door is <a href="/">here</a>.</p></noscript>
  <script src="labyrinth.js?v=20260808b"></script>
</body>
</html>
